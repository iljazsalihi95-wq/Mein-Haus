name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create Android wrapper
        run: |
          mkdir -p android/app/src/main/java/com/meinhaushalt/ft android/app/src/main/res/drawable android/app/src/main/res/mipmap-hdpi android/app/src/main/assets/www
          cp icon-128.jpg android/app/src/main/res/drawable/app_icon.jpg
          cp index.html app.js manifest.json sw.js logo.jpg icon-128.jpg android/app/src/main/assets/www/
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='MeinHaus'
          include ':app'
          EOF
          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.meinhaushalt.ft'; compileSdk 35
            defaultConfig { applicationId 'com.meinhaushalt.ft'; minSdk 24; targetSdk 35; versionCode 2; versionName '0.2.0' }
          }
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="MeinHaushalt FT" android:icon="@drawable/app_icon" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#2878F0</item><item name="android:navigationBarColor">#FFFFFF</item><item name="android:statusBarColor">#FFFFFF</item><item name="android:windowLightStatusBar">true</item></style></resources>
          EOF
          cat > android/app/src/main/java/com/meinhaushalt/ft/MainActivity.java <<'EOF'
          package com.meinhaushalt.ft;
          import android.app.*; import android.os.*; import android.webkit.*; import android.content.*;
          public class MainActivity extends Activity {
            WebView w;
            public void onCreate(Bundle b){super.onCreate(b);w=new WebView(this);setContentView(w);WebSettings s=w.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);w.setWebViewClient(new WebViewClient());w.loadUrl("file:///android_asset/www/index.html");}
            public void onBackPressed(){if(w.canGoBack())w.goBack();else super.onBackPressed();}
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MeinHaus-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
