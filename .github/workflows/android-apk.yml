name: Build Mein Haus Native APK
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "app.js"
      - "style.css"
      - "tax-private.js"
      - "modules/**"
      - "image/**"
      - "icon-128.jpg"
      - ".github/workflows/android-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Use approved MeinHaushalt FT launcher icon
        run: cp ../icon-128.jpg app/src/main/res/drawable/install_icon.jpg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bundle current application
        run: |
          mkdir -p app/src/main/assets
          cp ../index.html ../app.js ../style.css ../tax-private.js ../manifest.json ../sw.js ../logo.jpg ../icon-128.jpg app/src/main/assets/
          cp -R ../modules ../image app/src/main/assets/
      - name: Build native Android APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MeinHaushalt-FT-1.3.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
