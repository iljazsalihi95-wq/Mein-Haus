<!DOCTYPE html><html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Terminet / Termine</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7fc;color:#152238}body{padding-bottom:90px}.wrap{max-width:950px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#1269d3,#258cf0);color:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 30px #1269d340}.heroTop{display:flex;align-items:center;gap:13px}.heroIcon{width:58px;height:58px;border-radius:17px;background:#fff;color:#1677e8;display:flex;align-items:center;justify-content:center;font-size:32px}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0 0;font-size:13px;opacity:.9}.lang{margin-left:auto;border:0;border-radius:10px;padding:8px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#ffffff1d;border:1px solid #ffffff35;border-radius:14px;padding:10px 5px;text-align:center}.stat span{display:block;font-size:10px}.stat strong{display:block;font-size:20px;margin-top:3px}
.nextBox{margin:12px 0;background:#fff;border-radius:18px;padding:14px;box-shadow:0 12px 28px #102a4b24;border:1px solid #dbe9f8}.nextBox .eyebrow{font-size:11px;font-weight:900;color:#1677e8}.nextBox h3{margin:6px 0 5px}.nextBox .countdown{display:inline-block;margin-top:8px;background:#e8f4ff;color:#1269d3;border-radius:10px;padding:6px 9px;font-weight:900;font-size:12px}.nextBox.urgent{box-shadow:0 0 0 2px #18a75b33,0 14px 34px #18a75b2e;border-color:#8edbb1}
.addBar{margin:12px 0;display:flex;gap:8px}.addBtn{flex:1;border:0;border-radius:14px;padding:13px;background:#18a75b;color:#fff;font-size:15px;font-weight:900;box-shadow:0 5px 14px #18a75b30}.refreshBtn{width:50px;border:0;border-radius:14px;background:#fff;color:#1677e8;font-size:21px;box-shadow:0 4px 14px #162f501a}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px}.filter{border:1px solid #d8e3f0;background:#fff;color:#526176;border-radius:22px;padding:9px 13px;white-space:nowrap;font-weight:800}.filter.active{background:#1677e8;color:#fff}.search{width:100%;border:1px solid #d8e3f0;background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:11px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:12px 3px 8px}.list{display:grid;gap:10px}.card{background:#fff;border-radius:18px;padding:13px;box-shadow:0 10px 25px #162f501a;border-left:5px solid #1677e8}.card.today{border-left-color:#18a75b;box-shadow:0 12px 30px #18a75b22}.card.past{opacity:.68;border-left-color:#a0aec0}.cardTop{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px}.dateBox{width:58px;height:62px;border-radius:14px;background:#edf5ff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1269d3}.dateBox b{font-size:23px}.title{font-size:16px;font-weight:900}.person{display:inline-block;margin-top:5px;background:#edf5ff;color:#1269d3;padding:4px 8px;border-radius:8px;font-size:11px;font-weight:900}.info,.notes{font-size:12px;color:#65758b;margin-top:7px;line-height:1.55}.notes{background:#f7f9fc;padding:8px 10px;border-radius:10px}.actions{display:flex;gap:7px;margin-top:11px;border-top:1px solid #edf1f6;padding-top:10px}.editBtn,.deleteBtn{border:0;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:900}.editBtn{background:#e9f3ff;color:#1269d3}.deleteBtn{background:#ffeaea;color:#c62828}.badgeToday{margin-left:5px;padding:3px 7px;border-radius:7px;background:#e1f8ea;color:#168445;font-size:9px;font-weight:900}.empty{background:#fff;border-radius:18px;text-align:center;padding:35px;color:#718096}.loader{width:32px;height:32px;margin:30px auto;border:4px solid #dce7f4;border-top-color:#1677e8;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{background:#ffeaea;color:#b42318;border-radius:13px;padding:12px;text-align:center}.modal{display:none;position:fixed;inset:0;z-index:9999;background:#041123b8;padding:15px;overflow:auto}.modal.show{display:block}.modalBox{max-width:520px;margin:15px auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 22px 55px #0005}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:41px;height:41px;border:0;border-radius:50%;font-size:22px}.field{margin-bottom:10px}.field label{display:block;margin:0 0 5px 3px;color:#526176;font-size:12px;font-weight:900}.field input,.field textarea,.field select{width:100%;border:1px solid #d7e1ee;border-radius:12px;padding:12px;font-size:15px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{width:100%;border:0;border-radius:13px;padding:14px;background:#1677e8;color:#fff;font-size:16px;font-weight:900}.message{text-align:center;padding:9px;font-size:13px;font-weight:800}@media(max-width:400px){.two{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="hero"><div class="heroTop"><div class="heroIcon">📅</div><div><h1 id="hTitle">Terminet</h1><p id="hSub">Kalendari i familjes</p></div><select id="lang" class="lang" onchange="setLang(this.value)"><option value="de">DE</option><option value="sq">SQ</option><option value="en">EN</option></select></div><div class="stats"><div class="stat"><span id="sToday">SOT</span><strong id="todayCount">0</strong></div><div class="stat"><span id="sUpcoming">NË VAZHDIM</span><strong id="upcomingCount">0</strong></div><div class="stat"><span id="sTotal">GJITHSEJ</span><strong id="totalCount">0</strong></div></div></div>
<div id="nextBox" class="nextBox"><div class="eyebrow" id="nextLabel">TERMINI MË I AFËRT</div><div id="nextContent">—</div></div>
<div class="addBar"><button id="addBtn" class="addBtn" onclick="openAdd()">＋ Shto termin</button><button class="refreshBtn" onclick="loadAppointments()">↻</button></div><div class="filters"><button id="fUpcoming" class="filter active" onclick="setFilter('upcoming',this)">📆 Të ardhshme</button><button id="fToday" class="filter" onclick="setFilter('today',this)">🔔 Sot</button><button id="fAll" class="filter" onclick="setFilter('all',this)">Të gjitha</button><button id="fPast" class="filter" onclick="setFilter('past',this)">Të kaluara</button></div><input id="search" class="search" oninput="render()"><div id="errorBox"></div><div class="sectionTitle"><strong id="listTitle">Terminet e ardhshme</strong><span id="status"></span></div><div id="list" class="list"><div class="loader"></div></div></div>
<div id="modal" class="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle">📅 Termin i ri</h2><button class="close" onclick="closeModal()">×</button></div><input type="hidden" id="appointmentId"><div class="two"><div class="field"><label>Emri / Vorname</label><input id="firstName"></div><div class="field"><label>Mbiemri / Nachname</label><input id="lastName"></div></div><div class="field"><label>Termini / Termin</label><input id="apptTitle"></div><div class="two"><div class="field"><label>Data / Datum</label><input id="date" type="date"></div><div class="field"><label>Ora / Uhrzeit</label><input id="time" type="time"></div></div><div class="field"><label>Vendi / Ort</label><input id="location"></div><div class="field"><label>Kujtesa / Erinnerung</label><select id="remindMinutes"><option value="0">Pa kujtesë</option><option value="15">15 min</option><option value="30" selected>30 min</option><option value="60">1 orë</option><option value="120">2 orë</option><option value="1440">1 ditë</option><option value="2880">2 ditë</option><option value="10080">1 javë</option></select></div><div class="field"><label>Shënime / Notizen</label><textarea id="notes"></textarea></div><button id="saveBtn" class="save" onclick="saveAppointment()">💾 Ruaj</button><div id="saveMessage" class="message"></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';let appointments=[],currentFilter='upcoming',noticeTimer=null;
const TR={sq:{title:'Terminet',sub:'Kalendari i familjes',today:'SOT',up:'NË VAZHDIM',total:'GJITHSEJ',next:'TERMINI MË I AFËRT',add:'＋ Shto termin',fu:'📆 Të ardhshme',ft:'🔔 Sot',fa:'Të gjitha',fp:'Të kaluara',search:'🔎 Kërko termin, person, vend...',empty:'Nuk ka termine në këtë kategori.',save:'Ruaj'},de:{title:'Termine',sub:'Familienkalender',today:'HEUTE',up:'KOMMEND',total:'GESAMT',next:'NÄCHSTER TERMIN',add:'＋ Neuer Termin',fu:'📆 Kommende',ft:'🔔 Heute',fa:'Alle',fp:'Vergangene',search:'🔎 Termin, Person, Ort suchen...',empty:'Keine Termine in dieser Kategorie.',save:'Speichern'},en:{title:'Appointments',sub:'Family calendar',today:'TODAY',up:'UPCOMING',total:'TOTAL',next:'NEXT APPOINTMENT',add:'＋ New appointment',fu:'📆 Upcoming',ft:'🔔 Today',fa:'All',fp:'Past',search:'🔎 Search appointment, person, place...',empty:'No appointments in this category.',save:'Save'}};
function L(){return localStorage.getItem('mh_language')||'de'}function T(){return TR[L()]||TR.en}function getToken(){return localStorage.getItem('sessionToken')||localStorage.getItem('token')||''}function esc(v){return String(v??'').replace(/&/g,String.fromCharCode(38)+'amp;').replace(/</g,String.fromCharCode(38)+'lt;').replace(/>/g,String.fromCharCode(38)+'gt;').replace(/"/g,String.fromCharCode(38)+'quot;').replace(/'/g,String.fromCharCode(38)+'#39;')}
async function api(action,data={}){if(!getToken())throw Error('LOGIN_REQUIRED');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:getToken(),...data})}),raw=(await r.text()).replace(/^\uFEFF/,'').trim();if(!raw)throw Error('EMPTY_SERVER_RESPONSE');const j=JSON.parse(raw);if(j.ok===false)throw Error(j.error||'SERVER_ERROR');return Object.prototype.hasOwnProperty.call(j,'data')?j.data:j}
function arr(r){if(Array.isArray(r))return r;if(Array.isArray(r?.items))return r.items;if(Array.isArray(r?.data))return r.data;return[]}function norm(x){return{appointmentId:x.appointmentId||'',firstName:x.firstName||'',lastName:x.lastName||'',title:x.title||'',date:String(x.date||'').slice(0,10),time:String(x.time||'').slice(0,5),location:x.location||'',notes:x.notes||'',remindMinutes:Number(x.remindMinutes||0),status:x.status||'active'}}
function localDate(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),a=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+a}function dt(x){return new Date((x.date||'1970-01-01')+'T'+(x.time||'00:00'))}function monthName(d){return d?['Jan','Shk','Mar','Pri','Maj','Qer','Kor','Gus','Sht','Tet','Nën','Dhj'][Number(d.split('-')[1])-1]||'':''}
async function loadAppointments(){list.innerHTML='<div class="loader"></div>';errorBox.innerHTML='';try{appointments=arr(await api('appointmentList')).map(norm);status.textContent=appointments.length+' Termine';render();scheduleNotice()}catch(e){appointments=[];render();errorBox.innerHTML='<div class="error">⚠️ '+esc(e.message)+'</div>'}}
function upcomingRows(){const now=Date.now();return appointments.filter(x=>dt(x).getTime()>=now).sort((a,b)=>dt(a)-dt(b))}
function renderNext(){const x=upcomingRows()[0];if(!x){nextContent.innerHTML='<div class="info">'+esc(T().empty)+'</div>';nextBox.classList.remove('urgent');return}const diff=dt(x)-Date.now(),mins=Math.max(0,Math.floor(diff/60000)),days=Math.floor(mins/1440),hrs=Math.floor((mins%1440)/60),mm=mins%60;const person=[x.firstName,x.lastName].filter(Boolean).join(' ');nextBox.classList.toggle('urgent',diff<=86400000);nextContent.innerHTML='<h3>'+esc(x.title||'Termin')+'</h3><div class="info">📅 '+esc(x.date)+' · ⏰ '+esc(x.time||'--:--')+(x.location?' · 📍 '+esc(x.location):'')+(person?'<br>👤 '+esc(person):'')+'</div><span class="countdown">⏳ '+(days?days+' d ':'')+(hrs?hrs+' h ':'')+mm+' min</span>'}
function filtered(){const today=localDate(),q=search.value.trim().toLowerCase();return appointments.filter(x=>{if(q&&!(x.firstName+' '+x.lastName+' '+x.title+' '+x.location+' '+x.notes).toLowerCase().includes(q))return false;if(currentFilter==='today')return x.date===today;if(currentFilter==='upcoming')return dt(x).getTime()>=new Date(today+'T00:00').getTime();if(currentFilter==='past')return dt(x).getTime()<new Date(today+'T00:00').getTime();return true})}
function setFilter(f,b){currentFilter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function render(){const today=localDate(),r=filtered().sort((a,b)=>currentFilter==='past'?dt(b)-dt(a):dt(a)-dt(b));todayCount.textContent=appointments.filter(x=>x.date===today).length;upcomingCount.textContent=upcomingRows().length;totalCount.textContent=appointments.length;renderNext();list.innerHTML=r.length?r.map(x=>{const isToday=x.date===today,isPast=dt(x)<new Date(today+'T00:00'),person=[x.firstName,x.lastName].filter(Boolean).join(' '),day=x.date?Number(x.date.split('-')[2]):'--';return '<div class="card '+(isToday?'today ':'')+(isPast?'past':'')+'"><div class="cardTop"><div class="dateBox"><b>'+esc(day)+'</b><small>'+esc(monthName(x.date))+'</small></div><div><div class="title">'+esc(x.title||'Termin')+(isToday?'<span class="badgeToday">'+esc(T().today)+'</span>':'')+'</div>'+(person?'<div class="person">👤 '+esc(person)+'</div>':'')+'<div class="info">📅 '+esc(x.date)+(x.time?' · ⏰ '+esc(x.time):'')+(x.location?'<br>📍 '+esc(x.location):'')+'</div>'+(x.notes?'<div class="notes">📝 '+esc(x.notes)+'</div>':'')+'</div></div><div class="actions"><button class="editBtn" data-edit="'+esc(x.appointmentId)+'">✏️</button><button class="deleteBtn" data-delete="'+esc(x.appointmentId)+'">🗑️</button></div></div>'}).join(''):'<div class="empty">📅<br><br>'+esc(T().empty)+'</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editAppointment(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteAppointment(b.dataset.delete))}
function scheduleNotice(){clearTimeout(noticeTimer);const x=upcomingRows()[0];if(!x)return;const when=dt(x).getTime()-Number(x.remindMinutes||0)*60000,delay=when-Date.now();if(delay>0&&delay<2147483647)noticeTimer=setTimeout(()=>notify(x),delay);else if(delay<=0&&dt(x)>Date.now()&&Date.now()-when<60000)notify(x)}
function notify(x){if('Notification'in window&&Notification.permission==='granted')new Notification(x.title||'Termin',{body:(x.time?x.time+' · ':'')+(x.location||'')});if(navigator.vibrate)navigator.vibrate([250,120,250]);nextBox.classList.add('urgent')}
function requestNotify(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission()}
function clearForm(){appointmentId.value=firstName.value=lastName.value=apptTitle.value=time.value=location.value=notes.value='';date.value=localDate();remindMinutes.value='30';saveMessage.textContent=''}function openAdd(){clearForm();modal.classList.add('show');requestNotify()}function closeModal(){modal.classList.remove('show')}
function editAppointment(id){const x=appointments.find(a=>a.appointmentId===id);if(!x)return;appointmentId.value=x.appointmentId;firstName.value=x.firstName;lastName.value=x.lastName;apptTitle.value=x.title;date.value=x.date;time.value=x.time;location.value=x.location;notes.value=x.notes;remindMinutes.value=String(x.remindMinutes||0);modal.classList.add('show')}
async function saveAppointment(){if(!apptTitle.value.trim()){saveMessage.textContent='⚠️ Termin';return}if(!date.value){saveMessage.textContent='⚠️ Datum';return}try{await api('appointmentSave',{appointmentId:appointmentId.value,firstName:firstName.value.trim(),lastName:lastName.value.trim(),title:apptTitle.value.trim(),date:date.value,time:time.value,location:location.value.trim(),notes:notes.value.trim(),remindMinutes:Number(remindMinutes.value),status:'active'});saveMessage.textContent='✅';await loadAppointments();setTimeout(closeModal,400)}catch(e){saveMessage.textContent='⚠️ '+e.message}}
async function deleteAppointment(id){if(!confirm('Delete?'))return;try{await api('appointmentDelete',{appointmentId:id});await loadAppointments()}catch(e){alert(e.message)}}
function applyLang(){const t=T();hTitle.textContent=t.title;hSub.textContent=t.sub;sToday.textContent=t.today;sUpcoming.textContent=t.up;sTotal.textContent=t.total;nextLabel.textContent=t.next;addBtn.textContent=t.add;fUpcoming.textContent=t.fu;fToday.textContent=t.ft;fAll.textContent=t.fa;fPast.textContent=t.fp;search.placeholder=t.search;saveBtn.textContent='💾 '+t.save;lang.value=L();render()}function setLang(v){localStorage.setItem('mh_language',v);applyLang()}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});lang.value=L();applyLang();loadAppointments();setInterval(()=>{renderNext()},30000);
</script></body></html>
