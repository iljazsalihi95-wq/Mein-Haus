<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ofertat LIVE • MeinHaushalt FT</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#152238}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0877d8,#039be5);color:white;padding:14px 16px}.head{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#fff2;display:grid;place-items:center;font-size:27px}.head h1{font-size:22px;margin:0;flex:1}.lang{border:0;border-radius:14px;padding:11px;background:white;font-weight:800}.wrap{max-width:1100px;margin:auto;padding:14px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}select,input{width:100%;border:1px solid #d7e1ee;background:#fff;border-radius:13px;padding:12px}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{background:#e9f3ff;color:#0864b6;padding:8px 11px;border-radius:999px;font-weight:800;font-size:13px}.cats{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.cat{white-space:nowrap;border:1px solid #d6e3f3;background:#fff;border-radius:999px;padding:9px 12px;font-weight:800;cursor:pointer}.cat.on{background:#0877d8;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px #1c4b7d18;border:1px solid #e3eaf3}.photo{height:210px;background:white;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.noimg{font-size:46px}.body{padding:13px}.store{font-size:13px;font-weight:900;color:#65758a}.name{font-size:17px;font-weight:900;margin:7px 0;min-height:40px}.meta{font-size:13px;color:#69788d}.price{font-size:27px;font-weight:900;color:#df2735;margin-top:9px}.old{text-decoration:line-through;color:#8793a3;font-size:14px;margin-left:6px}.actions{display:flex;gap:8px;margin-top:11px}.btn{flex:1;border:0;border-radius:12px;padding:11px;font-weight:900;background:#e9f3ff;color:#0871cc;cursor:pointer}.btn.primary{background:#0877d8;color:white}.empty{background:white;padding:28px;border-radius:18px;text-align:center;color:#68788c}.loading{text-align:center;padding:35px;font-weight:800}.error{color:#b42318}.retry{max-width:220px;margin:12px auto}.sub{font-size:12px;opacity:.85;margin-top:3px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.photo{height:190px}.wrap{padding:10px}}@media(max-width:420px){.photo{height:165px}.name{font-size:15px}.price{font-size:23px}}</style></head><body>
<header class="top"><div class="head"><div class="logo">🛍️</div><div style="flex:1"><h1 id="title">Ofertat LIVE</h1><div class="sub" id="subtitle">MeinHaushalt FT</div></div><select id="lang" class="lang" aria-label="Language"><option value="sq">🇦🇱 SQ</option><option value="de">🇩🇪 DE</option><option value="en">🇬🇧 EN</option><option value="it">🇮🇹 IT</option><option value="tr">🇹🇷 TR</option><option value="mk">🇲🇰 MK</option><option value="bs">🇧🇦 BS</option></select></div></header>
<main class="wrap"><div class="filters"><select id="country"></select><select id="city"></select><select id="store"></select><select id="category"></select></div><input id="search" placeholder="Kërko…"><div class="stats"><span class="pill" id="count">—</span><span class="pill" id="storeCount">—</span><span class="pill" id="catCount">—</span></div><div id="catChips" class="cats"></div><div id="items" class="loading">⏳</div></main>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';
const COUNTRIES=['DE','IT','AT','CH','TR','MK','BA'];
const NAMES={DE:'Deutschland',IT:'Italia',AT:'Österreich',CH:'Schweiz',TR:'Türkiye',MK:'Северна Македонија',BA:'Bosna i Hercegovina'};
const T={
sq:['Ofertat LIVE','Të gjitha shtetet','Të gjitha qytetet','Të gjitha dyqanet','Të gjitha kategoritë','Kërko produkt, dyqan ose kategori…','oferta','dyqane','kategori','Nuk u gjetën oferta.','＋ Në listë','↗ Oferta','Po ngarkohen ofertat…','Riprovo','Gabim gjatë ngarkimit','U shtua në listën e blerjeve','Hyr në llogari për ta shtuar','Disa shtete nuk u ngarkuan'],
de:['LIVE-Angebote','Alle Länder','Alle Städte','Alle Geschäfte','Alle Kategorien','Produkt, Geschäft oder Kategorie suchen…','Angebote','Geschäfte','Kategorien','Keine Angebote gefunden.','＋ Zur Liste','↗ Angebot','Angebote werden geladen…','Erneut versuchen','Fehler beim Laden','Zur Einkaufsliste hinzugefügt','Bitte anmelden, um hinzuzufügen','Einige Länder konnten nicht geladen werden'],
en:['LIVE Offers','All countries','All cities','All stores','All categories','Search product, store or category…','offers','stores','categories','No offers found.','＋ Add to list','↗ Offer','Loading offers…','Retry','Loading error','Added to shopping list','Sign in to add to your list','Some countries could not be loaded'],
it:['Offerte LIVE','Tutti i paesi','Tutte le città','Tutti i negozi','Tutte le categorie','Cerca prodotto, negozio o categoria…','offerte','negozi','categorie','Nessuna offerta trovata.','＋ Aggiungi alla lista','↗ Offerta','Caricamento offerte…','Riprova','Errore di caricamento','Aggiunto alla lista della spesa','Accedi per aggiungere alla lista','Alcuni paesi non sono stati caricati'],
tr:['CANLI Fırsatlar','Tüm ülkeler','Tüm şehirler','Tüm mağazalar','Tüm kategoriler','Ürün, mağaza veya kategori ara…','fırsat','mağaza','kategori','Fırsat bulunamadı.','＋ Listeye ekle','↗ Fırsat','Fırsatlar yükleniyor…','Tekrar dene','Yükleme hatası','Alışveriş listesine eklendi','Listeye eklemek için giriş yapın','Bazı ülkeler yüklenemedi'],
mk:['Понуди ВО ЖИВО','Сите држави','Сите градови','Сите продавници','Сите категории','Пребарај производ, продавница или категорија…','понуди','продавници','категории','Нема пронајдени понуди.','＋ Додај во листа','↗ Понуда','Се вчитуваат понудите…','Обиди се повторно','Грешка при вчитување','Додадено во листата за купување','Најавете се за да додадете','Некои држави не се вчитани'],
bs:['Ponude UŽIVO','Sve države','Svi gradovi','Sve prodavnice','Sve kategorije','Pretraži proizvod, prodavnicu ili kategoriju…','ponuda','prodavnica','kategorija','Nema pronađenih ponuda.','＋ Dodaj na listu','↗ Ponuda','Učitavanje ponuda…','Pokušaj ponovo','Greška pri učitavanju','Dodano na listu za kupovinu','Prijavite se da dodate na listu','Neke države nisu učitane']};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>String.fromCharCode(38)+'#'+c.charCodeAt(0)+';');
let LANG=T[localStorage.getItem('mh_language')]?localStorage.getItem('mh_language'):'sq',ALL=[],loaded=false,errors=[],loading=false,visible=[];
const tx=i=>(T[LANG]||T.sq)[i];
function token(){for(const storage of [sessionStorage,localStorage])for(const k of ['sessionToken','mh_token','token','mh_session_token']){try{let v=storage.getItem(k);if(v)return v}catch(e){}}return ''}
async function api(action,p={}){const b={action,...p};if(token())b.token=token();const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(b),redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const raw=(await r.text()).replace(/^\uFEFF/,'').trim();let j;try{j=JSON.parse(raw)}catch(e){throw Error('SERVER_NOT_JSON')}if(j?.ok===false)throw Error(j.error||'API_ERROR');return Object.prototype.hasOwnProperty.call(j||{},'data')?j.data:j}
function arr(x){if(Array.isArray(x))return x;for(const a of [x?.items,x?.offers,x?.data?.items,x?.data?.offers])if(Array.isArray(a))return a;return []}
function norm(o,c){return{id:o.offerId||o.id||o.ID||'',country:String(o.country||o.Shteti||c||'').toUpperCase(),city:o.city||o.Rajoni_Qyteti||'',store:o.store||o.Dyqani||'',category:o.category||o.Kategoria||'',name:o.name||o.product||o.Produkti||'',size:o.size||o.Sasia||'',price:o.price??o.Cmimi??'',oldPrice:o.oldPrice??o.Cmimi_Vjeter??'',image:o.imageUrl||o.image||o.Foto_URL||'',url:o.sourceUrl||o.url||o.Oferta_URL||''}}
function uniq(a){return [...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)))}
function opt(v,l){return '<option value="'+esc(v)+'">'+esc(l)+'</option>'}
function fillFilters(){let oc=$('country').value;$('country').innerHTML=opt('',tx(1))+COUNTRIES.map(c=>opt(c,NAMES[c])).join('');$('country').value=COUNTRIES.includes(oc)?oc:'';let base=ALL.filter(x=>!$('country').value||x.country===$('country').value);for(const [id,ix,key] of [['city',2,'city'],['store',3,'store'],['category',4,'category']]){let e=$(id),old=e.value;e.innerHTML=opt('',tx(ix))+uniq(base.map(x=>x[key])).map(v=>opt(v,v)).join('');if([...e.options].some(o=>o.value===old))e.value=old}}
function applyLang(){document.documentElement.lang=LANG;$('lang').value=LANG;$('title').textContent=tx(0);$('search').placeholder=tx(5);fillFilters();render()}
function setLang(v){LANG=T[v]?v:'sq';localStorage.setItem('mh_language',LANG);localStorage.setItem('lang',LANG);applyLang()}
function filtered(){let q=$('search').value.trim().toLocaleLowerCase();return ALL.filter(x=>(!$('country').value||x.country===$('country').value)&&(!$('city').value||x.city===$('city').value)&&(!$('store').value||x.store===$('store').value)&&(!$('category').value||x.category===$('category').value)&&(!q||(x.name+' '+x.store+' '+x.category).toLocaleLowerCase().includes(q)))}
function safeUrl(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function render(){if(!loaded){$('items').className='loading';$('items').textContent=tx(12);return}let r=filtered();visible=r;let stores=uniq(r.map(x=>x.store)),cats=uniq(r.map(x=>x.category));$('count').textContent=r.length+' '+tx(6);$('storeCount').textContent=stores.length+' '+tx(7);$('catCount').textContent=cats.length+' '+tx(8);$('catChips').innerHTML=cats.map(c=>'<button type="button" class="cat '+($('category').value===c?'on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('');if(!r.length){$('items').className='';$('items').innerHTML='<div class="empty">'+esc(tx(9))+'</div>';return}$('items').className='grid';$('items').innerHTML=r.map((o,i)=>{let link=safeUrl(o.url),img=safeUrl(o.image);return '<article class="card"><div class="photo">'+(img?'<img src="'+esc(img)+'" loading="lazy" alt="">':'<div class="noimg">🛒</div>')+'</div><div class="body"><div class="store">'+esc(o.store)+' · '+esc(o.city)+'</div><div class="name">'+esc(o.name)+'</div><div class="meta">'+esc(o.category)+' '+esc(o.size)+'</div><div class="price">'+esc(o.price)+' € '+(o.oldPrice?'<span class="old">'+esc(o.oldPrice)+' €</span>':'')+'</div><div class="actions"><button type="button" class="btn" data-add="'+i+'">'+esc(tx(10))+'</button>'+(link?'<button type="button" class="btn primary" data-link="'+esc(link)+'">'+esc(tx(11))+'</button>':'')+'</div></div></article>'}).join('')}
async function addList(i,btn){let o=visible[i];if(!o)return;if(!token()){alert(tx(16));return}btn.disabled=true;try{await api('shoppingAdd',{product:o.name,quantity:1,unit:'copë',category:o.category,storeHint:o.store,source:'offer',offerId:o.id});alert('✓ '+tx(15)+': '+o.name)}catch(e){alert('⚠️ '+e.message)}finally{btn.disabled=false}}
async function loadAll(){if(loading)return;loading=true;loaded=false;$('items').className='loading';$('items').textContent=tx(12);try{let results=await Promise.allSettled(COUNTRIES.map(c=>api('publicOffers',{country:c,active:true}).then(x=>arr(x).map(o=>norm(o,c)))));errors=results.map((r,i)=>r.status==='rejected'?COUNTRIES[i]:null).filter(Boolean);ALL=results.flatMap(r=>r.status==='fulfilled'?r.value:[]).filter(x=>x.name);loaded=true;fillFilters();render();if(errors.length){let msg=document.createElement('div');msg.className='empty error';msg.textContent='⚠️ '+tx(17)+': '+errors.join(', ');$('items').prepend(msg);if(errors.length===COUNTRIES.length){$('items').innerHTML='<div class="empty error">⚠️ '+tx(14)+': '+esc(results[0].reason?.message||'API_ERROR')+'</div><button class="btn retry" id="retry">'+esc(tx(13))+'</button>';$('retry').onclick=loadAll}}}finally{loading=false}}
$('lang').onchange=e=>setLang(e.target.value);$('country').onchange=()=>{$('city').value='';$('store').value='';$('category').value='';fillFilters();render()};for(const id of ['city','store','category'])$(id).onchange=render;$('search').oninput=render;
$('catChips').onclick=e=>{let b=e.target.closest('[data-cat]');if(b){$('category').value=b.dataset.cat;render()}};
$('items').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.add!==undefined)addList(Number(b.dataset.add),b);else if(b.dataset.link){window.open(b.dataset.link,'_blank','noopener,noreferrer')}};
applyLang();loadAll().catch(e=>{$('items').innerHTML='<div class="empty error">⚠️ '+esc(e.message)+'</div>'});
</script></body></html>
