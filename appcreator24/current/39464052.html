<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Garancitë / Garantien</title>

<style>
*{box-sizing:border-box}
:root{
  --blue:#1677E8;
  --blue2:#0d5fc5;
  --bg:#F4F7FC;
  --card:#fff;
  --text:#152238;
  --muted:#6f7c91;
  --green:#18A75B;
  --red:#e5484d;
  --orange:#f59e0b;
  --border:#e3eaf5;
}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{
  max-width:950px;
  margin:auto;
  padding:14px 12px 90px;
}
.hero{
  background:linear-gradient(135deg,#1781f5,#074eac);
  color:#fff;
  padding:22px 18px;
  border-radius:24px;
  box-shadow:0 12px 30px #0756b530;
}
.heroTop{
  display:flex;
  align-items:center;
  gap:14px;
}
.heroIcon{
  width:64px;
  height:64px;
  border-radius:19px;
  background:#ffffff25;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
}
.hero h1{
  margin:0;
  font-size:26px;
}
.hero p{
  margin:5px 0 0;
  opacity:.88;
  font-size:14px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
}
.stat{
  background:#ffffff20;
  border:1px solid #ffffff2e;
  padding:11px 6px;
  border-radius:15px;
  text-align:center;
}
.stat b{
  display:block;
  font-size:21px;
}
.stat small{font-size:11px}

.actions{
  display:flex;
  gap:8px;
  margin:14px 0;
}
.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  font-weight:800;
  cursor:pointer;
}
.primary{
  flex:1;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  box-shadow:0 6px 18px #1677e830;
}
.refresh{
  background:#fff;
  color:var(--blue);
  border:1px solid var(--border);
}

.filters{
  background:#fff;
  padding:11px;
  border-radius:18px;
  box-shadow:0 5px 20px #19375d0c;
  margin-bottom:12px;
}
.search{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  padding:13px;
  font-size:15px;
  outline:none;
}
.filterRow{
  display:flex;
  gap:7px;
  margin-top:8px;
  overflow-x:auto;
}
.chip{
  white-space:nowrap;
  border:1px solid var(--border);
  background:#f8faff;
  padding:8px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}
.chip.active{
  color:#fff;
  background:var(--blue);
  border-color:var(--blue);
}

.card{
  background:#fff;
  border-radius:19px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 5px 22px #1c36580e;
  border:1px solid #edf1f7;
}
.cardTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.product{
  font-size:18px;
  font-weight:900;
}
.brand{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}
.badge{
  height:max-content;
  padding:6px 9px;
  border-radius:15px;
  font-size:11px;
  font-weight:900;
}
.good{background:#e7f8ee;color:#087d3e}
.warning{background:#fff3d9;color:#a46600}
.expired{background:#ffe5e5;color:#ba2929}

.infoGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:13px;
}
.info{
  background:#f7f9fd;
  padding:9px;
  border-radius:11px;
}
.info small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:3px;
}
.info b{
  font-size:13px;
}
.note{
  margin-top:10px;
  background:#f7f9fd;
  padding:9px;
  border-radius:10px;
  font-size:13px;
}
.cardButtons{
  display:flex;
  gap:7px;
  margin-top:12px;
}
.smallBtn{
  flex:1;
  border:0;
  padding:9px;
  border-radius:11px;
  font-weight:800;
  cursor:pointer;
}
.edit{
  background:#eaf3ff;
  color:#0965ce;
}
.delete{
  background:#ffeded;
  color:#c93333;
}
.open{
  background:#e8f8ee;
  color:#128047;
}

.empty{
  text-align:center;
  padding:50px 15px;
  color:var(--muted);
}
.emptyIcon{
  font-size:52px;
  margin-bottom:10px;
}

.overlay{
  position:fixed;
  inset:0;
  background:#07162caa;
  z-index:100;
  display:none;
  align-items:flex-end;
}
.modal{
  background:#fff;
  width:100%;
  max-height:92vh;
  overflow:auto;
  border-radius:25px 25px 0 0;
  padding:19px 15px 30px;
}
.modal h2{margin:0 0 15px}
label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin:11px 2px 5px;
}
input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #dce4f0;
  border-radius:12px;
  background:#fff;
  font-size:14px;
  outline:none;
}
textarea{
  min-height:75px;
  resize:vertical;
}
.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.save{
  width:100%;
  margin-top:17px;
  padding:14px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  font-size:15px;
  font-weight:900;
}
.cancel{
  width:100%;
  margin-top:7px;
  padding:12px;
  border:0;
  border-radius:13px;
  background:#edf1f7;
  color:#4d596b;
  font-weight:800;
}
.status{
  padding:11px;
  border-radius:12px;
  margin:10px 0;
  font-size:13px;
  display:none;
}
.error{background:#ffe8e8;color:#b52d2d}
.success{background:#e7f8ee;color:#087d3e}

@media(min-width:700px){
  .overlay{align-items:center;justify-content:center}
  .modal{
    width:580px;
    border-radius:25px;
    max-height:90vh;
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="hero">
  <div class="heroTop">
    <div class="heroIcon">🛡️</div>
    <div>
      <h1>Garancitë</h1>
      <p>Garantien · MeinHaushalt FT</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <b id="totalCount">0</b>
      <small>Gjithsej</small>
    </div>
    <div class="stat">
      <b id="soonCount">0</b>
      <small>Skadojnë së shpejti</small>
    </div>
    <div class="stat">
      <b id="expiredCount">0</b>
      <small>Të skaduara</small>
    </div>
  </div>
</div>

<div id="status" class="status"></div>

<div class="actions">
  <button class="btn primary" onclick="newWarranty()">
    ＋ Shto garanci / Garantie hinzufügen
  </button>
  <button class="btn refresh" onclick="loadWarranties()">↻</button>
</div>

<div class="filters">
  <input
    id="search"
    class="search"
    placeholder="Kërko produkt, markë, dyqan..."
    oninput="render()">

  <div class="filterRow">
    <button class="chip active" data-filter="all" onclick="setFilter('all',this)">
      Të gjitha
    </button>
    <button class="chip" data-filter="active" onclick="setFilter('active',this)">
      Aktive
    </button>
    <button class="chip" data-filter="soon" onclick="setFilter('soon',this)">
      Skadojnë shpejt
    </button>
    <button class="chip" data-filter="expired" onclick="setFilter('expired',this)">
      Të skaduara
    </button>
  </div>
</div>

<div id="list"></div>

</div>


<div id="overlay" class="overlay">
<div class="modal">

<h2 id="modalTitle">Shto garanci / Garantie</h2>

<input type="hidden" id="warrantyId">

<label>Produkti / Produkt *</label>
<input id="product" placeholder="p.sh. Samsung TV">

<div class="two">
  <div>
    <label>Marka / Marke</label>
    <input id="brand" placeholder="Samsung">
  </div>
  <div>
    <label>Modeli / Modell</label>
    <input id="model" placeholder="QE65...">
  </div>
</div>

<label>Dyqani / Geschäft</label>
<input id="store" placeholder="MediaMarkt, Amazon...">

<div class="two">
  <div>
    <label>Çmimi / Preis €</label>
    <input id="price" type="number" step="0.01" placeholder="0.00">
  </div>

  <div>
    <label>Nr. serik / Seriennummer</label>
    <input id="serialNumber">
  </div>
</div>

<div class="two">
  <div>
    <label>Data e blerjes / Kaufdatum</label>
    <input id="purchaseDate" type="date">
  </div>

  <div>
    <label>Garancia deri / Garantie bis</label>
    <input id="expiryDate" type="date">
  </div>
</div>

<label>Anëtari / Familienmitglied</label>
<select id="memberId">
  <option value="">Familja / Haushalt</option>
</select>

<label>ID e faturës / Rechnungs-ID</label>
<input id="billId" placeholder="Opsionale">

<label>Linku i faturës/dokumentit</label>
<input id="fileUrl" type="url" placeholder="https://...">

<label>Shënim / Notiz</label>
<textarea id="note" placeholder="Informacione shtesë..."></textarea>

<button class="save" onclick="saveWarranty()">
  Ruaj / Speichern
</button>

<button class="cancel" onclick="closeModal()">
  Anulo / Abbrechen
</button>

</div>
</div>


<script>
const API =
'https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';

let warranties=[];
let members=[];
let currentFilter='all';

function token(){
  return localStorage.getItem('sessionToken') ||
         localStorage.getItem('token') || '';
}

async function api(action,data={}){
  const t=token();

  if(!t){
    throw new Error('LOGIN_REQUIRED');
  }

  const body=Object.assign({},data,{
    action:action,
    token:t
  });

  const r=await fetch(API,{
    method:'POST',
    headers:{
      'Content-Type':'text/plain;charset=utf-8'
    },
    body:JSON.stringify(body)
  });

  const j=await r.json();

  if(!j.ok){
    throw new Error(j.error || 'API_ERROR');
  }

  return j.data;
}

function msg(text,type='error'){
  const e=document.getElementById('status');
  e.className='status '+type;
  e.textContent=text;
  e.style.display='block';

  setTimeout(()=>{
    e.style.display='none';
  },4500);
}

async function init(){
  if(!token()){
    document.getElementById('list').innerHTML=
      '<div class="empty">'+
      '<div class="emptyIcon">🔐</div>'+
      '<b>Kërkohet hyrja në profil</b><br><br>'+
      'Bitte zuerst anmelden.'+
      '</div>';
    return;
  }

  try{
    await Promise.all([
      loadMembers(),
      loadWarranties()
    ]);
  }catch(e){
    msg('Gabim: '+e.message);
  }
}

async function loadMembers(){
  try{
    const d=await api('members');
    members=Array.isArray(d) ? d : (d?.items || []);

    const select=document.getElementById('memberId');

    select.innerHTML=
      '<option value="">Familja / Haushalt</option>';

    members.forEach(m=>{
      const id=m.memberId || m.userId || '';
      const name=
        m.displayName ||
        [m.firstName,m.lastName].filter(Boolean).join(' ') ||
        m.name ||
        'Anëtar';

      const o=document.createElement('option');
      o.value=id;
      o.textContent=name;
      select.appendChild(o);
    });

  }catch(e){
    console.log('Members:',e);
  }
}

async function loadWarranties(){
  document.getElementById('list').innerHTML=
    '<div class="empty">Duke ngarkuar / Wird geladen...</div>';

  try{
    const d=await api('warrantyList');

    warranties=Array.isArray(d) ? d : (d?.items || []);

    render();
  }catch(e){
    document.getElementById('list').innerHTML=
      '<div class="empty">'+
      '<div class="emptyIcon">⚠️</div>'+
      'Nuk u ngarkuan garancitë.<br>'+
      escapeHtml(e.message)+
      '</div>';
  }
}

function daysUntil(date){
  if(!date)return null;

  const today=new Date();
  today.setHours(0,0,0,0);

  const d=new Date(date+'T00:00:00');

  return Math.ceil(
    (d-today)/(1000*60*60*24)
  );
}

function warrantyState(w){
  const days=daysUntil(w.Skadimi);

  if(days===null)return 'active';
  if(days<0)return 'expired';
  if(days<=30)return 'soon';

  return 'active';
}

function updateStats(){
  let soon=0;
  let expired=0;

  warranties.forEach(w=>{
    const s=warrantyState(w);
    if(s==='soon')soon++;
    if(s==='expired')expired++;
  });

  document.getElementById('totalCount').textContent=warranties.length;
  document.getElementById('soonCount').textContent=soon;
  document.getElementById('expiredCount').textContent=expired;
}

function setFilter(f,el){
  currentFilter=f;

  document.querySelectorAll('.chip').forEach(x=>{
    x.classList.remove('active');
  });

  el.classList.add('active');

  render();
}

function memberName(id){
  if(!id)return 'Familja / Haushalt';

  const m=members.find(x=>
    String(x.memberId||x.userId||'')===String(id)
  );

  if(!m)return 'Anëtar';

  return m.displayName ||
    [m.firstName,m.lastName].filter(Boolean).join(' ') ||
    m.name ||
    'Anëtar';
}

function formatDate(d){
  if(!d)return '—';

  try{
    return new Date(d+'T00:00:00')
      .toLocaleDateString('de-DE');
  }catch(e){
    return d;
  }
}

function formatMoney(v){
  const n=Number(v||0);

  if(!n)return '—';

  return n.toLocaleString('de-DE',{
    style:'currency',
    currency:'EUR'
  });
}

function render(){
  updateStats();

  const q=document.getElementById('search')
    .value.toLowerCase().trim();

  let arr=warranties.filter(w=>{

    const state=warrantyState(w);

    if(currentFilter!=='all' && state!==currentFilter){
      return false;
    }

    if(q){
      const text=[
        w.Produkti,
        w.Marka,
        w.Modeli,
        w.Dyqani,
        w.SerialNumber
      ].join(' ').toLowerCase();

      if(!text.includes(q))return false;
    }

    return true;
  });

  arr.sort((a,b)=>{
    if(!a.Skadimi)return 1;
    if(!b.Skadimi)return -1;
    return String(a.Skadimi).localeCompare(String(b.Skadimi));
  });

  const box=document.getElementById('list');

  if(!arr.length){
    box.innerHTML=
      '<div class="empty">'+
      '<div class="emptyIcon">🛡️</div>'+
      '<b>Nuk ka garanci</b><br>'+
      'Keine Garantien vorhanden.'+
      '</div>';
    return;
  }

  box.innerHTML=arr.map(w=>{

    const state=warrantyState(w);
    const days=daysUntil(w.Skadimi);

    let badge='Aktive';
    let cls='good';

    if(state==='soon'){
      badge='Edhe '+days+' ditë';
      cls='warning';
    }

    if(state==='expired'){
      badge='Skaduar';
      cls='expired';
    }

    return `
    <div class="card">

      <div class="cardTop">
        <div>
          <div class="product">
            ${escapeHtml(w.Produkti || 'Produkt')}
          </div>

          <div class="brand">
            ${escapeHtml(
              [w.Marka,w.Modeli]
              .filter(Boolean)
              .join(' · ') || 'Pa markë'
            )}
          </div>
        </div>

        <span class="badge ${cls}">
          ${badge}
        </span>
      </div>

      <div class="infoGrid">

        <div class="info">
          <small>Dyqani / Geschäft</small>
          <b>${escapeHtml(w.Dyqani || '—')}</b>
        </div>

        <div class="info">
          <small>Çmimi / Preis</small>
          <b>${formatMoney(w.Cmimi)}</b>
        </div>

        <div class="info">
          <small>Blerë / Gekauft</small>
          <b>${formatDate(w.DataBlerjes)}</b>
        </div>

        <div class="info">
          <small>Garancia deri</small>
          <b>${formatDate(w.Skadimi)}</b>
        </div>

        <div class="info">
          <small>Anëtari</small>
          <b>${escapeHtml(memberName(w.memberId))}</b>
        </div>

        <div class="info">
          <small>Nr. serik</small>
          <b>${escapeHtml(w.SerialNumber || '—')}</b>
        </div>

      </div>

      ${w.Shenim ? `
        <div class="note">
          📝 ${escapeHtml(w.Shenim)}
        </div>
      ` : ''}

      <div class="cardButtons">

        <button
          class="smallBtn edit"
          onclick='editWarranty(${JSON.stringify(w.warrantyId)})'>
          ✏️ Ndrysho
        </button>

        ${w.fileUrl ? `
          <button
            class="smallBtn open"
            onclick='openFile(${JSON.stringify(w.fileUrl)})'>
            📄 Fatura
          </button>
        ` : ''}

        <button
          class="smallBtn delete"
          onclick='deleteWarranty(${JSON.stringify(w.warrantyId)})'>
          🗑️
        </button>

      </div>

    </div>
    `;
  }).join('');
}

function newWarranty(){
  clearForm();

  document.getElementById('modalTitle').textContent=
    'Shto garanci / Garantie hinzufügen';

  document.getElementById('purchaseDate').value=
    new Date().toISOString().slice(0,10);

  document.getElementById('overlay').style.display='flex';
}

function editWarranty(id){
  const w=warranties.find(x=>x.warrantyId===id);
  if(!w)return;

  document.getElementById('modalTitle').textContent=
    'Ndrysho garancinë / Garantie bearbeiten';

  document.getElementById('warrantyId').value=w.warrantyId || '';
  document.getElementById('product').value=w.Produkti || '';
  document.getElementById('brand').value=w.Marka || '';
  document.getElementById('model').value=w.Modeli || '';
  document.getElementById('store').value=w.Dyqani || '';
  document.getElementById('price').value=w.Cmimi || '';
  document.getElementById('purchaseDate').value=w.DataBlerjes || '';
  document.getElementById('expiryDate').value=w.Skadimi || '';
  document.getElementById('serialNumber').value=w.SerialNumber || '';
  document.getElementById('billId').value=w.FaturaId || '';
  document.getElementById('fileUrl').value=w.fileUrl || '';
  document.getElementById('memberId').value=w.memberId || '';
  document.getElementById('note').value=w.Shenim || '';

  document.getElementById('overlay').style.display='flex';
}

async function saveWarranty(){
  const product=document.getElementById('product')
    .value.trim();

  if(!product){
    msg('Shkruaj produktin / Produkt eingeben.');
    return;
  }

  const data={
    warrantyId:
      document.getElementById('warrantyId').value || undefined,

    product:product,

    brand:
      document.getElementById('brand').value.trim(),

    model:
      document.getElementById('model').value.trim(),

    store:
      document.getElementById('store').value.trim(),

    price:
      Number(document.getElementById('price').value || 0),

    purchaseDate:
      document.getElementById('purchaseDate').value,

    expiryDate:
      document.getElementById('expiryDate').value,

    serialNumber:
      document.getElementById('serialNumber').value.trim(),

    billId:
      document.getElementById('billId').value.trim(),

    fileUrl:
      document.getElementById('fileUrl').value.trim(),

    memberId:
      document.getElementById('memberId').value,

    note:
      document.getElementById('note').value.trim()
  };

  try{
    await api('warrantySave',data);

    closeModal();

    msg(
      'Garancia u ruajt / Garantie gespeichert.',
      'success'
    );

    await loadWarranties();

  }catch(e){
    msg('Gabim: '+e.message);
  }
}

async function deleteWarranty(id){
  if(!confirm(
    'Ta fshij këtë garanci?\nGarantie wirklich löschen?'
  ))return;

  try{
    await api('warrantyDelete',{
      warrantyId:id
    });

    msg(
      'Garancia u fshi / Garantie gelöscht.',
      'success'
    );

    await loadWarranties();

  }catch(e){
    msg('Gabim: '+e.message);
  }
}

function openFile(url){
  if(!url)return;
  window.open(url,'_blank');
}

function closeModal(){
  document.getElementById('overlay').style.display='none';
}

function clearForm(){
  [
    'warrantyId',
    'product',
    'brand',
    'model',
    'store',
    'price',
    'purchaseDate',
    'expiryDate',
    'serialNumber',
    'billId',
    'fileUrl',
    'note'
  ].forEach(id=>{
    document.getElementById(id).value='';
  });

  document.getElementById('memberId').value='';
}

function escapeHtml(v){
  return String(v ?? '')
    .replace(/&/g,String.fromCharCode(38)+'amp;')
    .replace(/</g,String.fromCharCode(38)+'lt;')
    .replace(/>/g,String.fromCharCode(38)+'gt;')
    .replace(/"/g,String.fromCharCode(38)+'quot;')
    .replace(/'/g,String.fromCharCode(38)+'#39;');
}

document.getElementById('overlay')
.addEventListener('click',function(e){
  if(e.target===this)closeModal();
});

init();
</script>

</body>
</html>
