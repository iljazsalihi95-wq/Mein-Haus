<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventari • MeinHaushalt FT v5.2</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fc;color:#152238}.wrap{max-width:900px;margin:auto;padding:12px 12px 70px}.hero{background:linear-gradient(135deg,#1269d3,#248cf0);color:white;border-radius:21px;padding:17px}.top{display:flex;align-items:center;gap:12px}.top h1{margin:0;font-size:24px}.top p{margin:4px 0 0;font-size:13px}.icon{font-size:31px;background:white;border-radius:14px;padding:10px}.lang{margin-left:auto;border:0;border-radius:10px;padding:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#ffffff25;padding:11px 5px;text-align:center;border-radius:13px}.stat strong{display:block;font-size:21px}.stat span{font-size:11px}.tools{display:grid;grid-template-columns:1fr 52px;gap:8px;margin:13px 0}.tools input,select,.field input,.field textarea{border:1px solid #d7e1ee;border-radius:11px;padding:12px;font-size:15px;min-width:0}.add{background:#159c57;color:white;border:0;border-radius:12px;font-size:28px}.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filter{border:1px solid #d9e3f0;background:white;border-radius:22px;padding:9px 12px;white-space:nowrap;font-weight:700}.filter.active{background:#1677e8;color:white}.list{display:grid;gap:9px}.item{background:white;border-radius:16px;padding:11px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;box-shadow:0 3px 12px #142b4b10}.photo{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#edf5ff}.placeholder{width:64px;height:64px;border-radius:12px;background:#edf5ff;display:grid;place-items:center;font-size:30px}.name{font-size:15px;font-weight:900;overflow-wrap:anywhere}.meta{color:#738197;font-size:12px;margin-top:4px}.qty{color:#1269d3;font-weight:900;text-align:right}.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.actions button{border:0;border-radius:8px;padding:7px;font-size:11px;font-weight:800;background:#e8f2ff;color:#1269d3}.actions .danger{background:#ffe9e9;color:#b42318}.badge{display:inline-block;background:#fff1d7;color:#925500;border-radius:7px;font-size:11px;padding:4px;margin-top:5px}.msg{text-align:center;padding:15px;color:#69788d}.error{background:#ffe7e7;color:#ad2929;border-radius:12px;padding:12px}.modal{display:none;position:fixed;inset:0;z-index:50;background:#041123b8;padding:14px;overflow:auto}.modal.show{display:block}.modalBox{background:white;max-width:520px;margin:20px auto;border-radius:20px;padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead button{border:0;border-radius:50%;font-size:25px;width:40px;height:40px}.field{margin:9px 0}.field label{display:block;font-size:12px;font-weight:bold;color:#526176;margin-bottom:5px}.field input,.field select,.field textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save{width:100%;background:#1677e8;color:white;border:0;border-radius:12px;padding:13px;font-weight:900}.thumb{width:110px;height:90px;object-fit:contain;display:block;margin:8px auto}@media(max-width:380px){.item{grid-template-columns:52px minmax(0,1fr) auto}.photo,.placeholder{width:52px;height:52px}.actions button{padding:6px}}
</style><script>(function(){try{const l=localStorage.getItem('lang')||localStorage.getItem('mh_language')||'sq';localStorage.setItem('lang',l);localStorage.setItem('mh_language',l)}catch(e){}})();</script></head><body><nav style="padding:10px;background:#fff"><a href="../index.html" style="color:#075ab5;text-decoration:none;font:600 15px Arial">‹ MeinHaushalt FT</a></nav><main class="wrap"><header class="hero"><div class="top"><div class="icon">📦</div><div><h1 id="title"></h1><p id="subtitle"></p></div><select id="lang" class="lang"><option value="sq">SQ</option><option value="de">DE</option><option value="en">EN</option><option value="it">IT</option><option value="tr">TR</option><option value="mk">MK</option><option value="bs">BS</option></select></div><div class="stats"><div class="stat"><strong id="totalCount">—</strong><span id="sProducts"></span></div><div class="stat"><strong id="lowCount">—</strong><span id="sLow"></span></div><div class="stat"><strong id="expiryCount">—</strong><span id="sExpiry"></span></div></div></header><div class="tools"><input id="search" type="search"><button id="addBtn" class="add">+</button></div><nav class="filters" id="filters"></nav><div id="status" class="msg"></div><div id="list" class="list"></div></main><div class="modal" id="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle"></h2><button id="closeBtn">×</button></div><div class="field"><label data-t="product"></label><input id="productName"></div><div class="two"><div class="field"><label data-t="quantity"></label><input id="quantity" type="number" min="0" step="0.01" value="1"></div><div class="field"><label data-t="unit"></label><select id="unit"><option value="copë">copë</option><option value="paketë">paketë</option><option>kg</option><option>g</option><option>L</option><option>ml</option></select></div></div><div class="field"><label data-t="category"></label><select id="category"><option value="Ushqime">Ushqime</option><option value="Pije">Pije</option><option value="Higjienë">Higjienë</option><option value="Shtëpi">Shtëpi</option><option value="Tjera">Tjera</option></select></div><div class="two"><div class="field"><label data-t="minimum"></label><input id="minimum" type="number" min="0" step="0.01" value="1"></div><div class="field"><label data-t="expiryDate"></label><input id="expiry" type="date"></div></div><div class="field"><label data-t="condition"></label><select id="itemStatus"><option value="">Normal</option><option value="Në stok">Në stok</option><option value="Po mbaron">Po mbaron</option><option value="Mbaruar">Mbaruar</option></select></div><div class="field"><label data-t="needBuy"></label><select id="needBuy"><option value="">Jo</option><option value="Po">Po</option></select></div><div class="field"><label data-t="note"></label><textarea id="note"></textarea></div><div class="field"><label data-t="photo"></label><input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp"><img id="preview" class="thumb" style="display:none"></div><button id="saveBtn" class="save"></button><div id="saveMsg" class="msg"></div></div></div>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';
const $=id=>document.getElementById(id),LANGS=['sq','de','en','it','tr','mk','bs'];
const keys=['title','subtitle','products','low','expiry','search','all','food','drink','hygiene','loading','empty','stock','buy','edit','del','consume','add','save','product','quantity','unit','category','minimum','expiryDate','condition','needBuy','note','photo','consPrompt','deletePrompt','saved','error','refresh','expired'];
const translations={
sq:['Inventari','Produktet që kemi në shtëpi','Produkte','Po mbarojnë','Skadojnë','🔎 Kërko produkt…','Të gjitha','Ushqime','Pije','Higjienë','Duke ngarkuar inventarin…','Nuk ka produkte.','Në stok','Duhet blerë','Ndrysho','Fshi','Harxho','Shto produkt','Ruaj','Produkti','Sasia','Njësia','Kategoria','Minimumi','Data e skadimit','Gjendja','Duhet blerë?','Shënim','Foto e produktit','Sa u harxhua?','A ta fshij këtë produkt?','U ruajt','Gabim','Rifresko','I skaduar'],
de:['Vorräte','Produkte im Haushalt','Produkte','Fast leer','Laufen ab','🔎 Produkt suchen…','Alle','Lebensmittel','Getränke','Hygiene','Vorräte werden geladen…','Keine Produkte.','Auf Lager','Nachkaufen','Bearbeiten','Löschen','Verbrauchen','Produkt hinzufügen','Speichern','Produkt','Menge','Einheit','Kategorie','Mindestmenge','Ablaufdatum','Status','Nachkaufen?','Notiz','Produktfoto','Wie viel wurde verbraucht?','Produkt wirklich löschen?','Gespeichert','Fehler','Aktualisieren','Abgelaufen'],
en:['Inventory','Products at home','Products','Running low','Expiring','🔎 Search products…','All','Food','Drinks','Hygiene','Loading inventory…','No products.','In stock','Buy','Edit','Delete','Consume','Add product','Save','Product','Quantity','Unit','Category','Minimum','Expiry date','Status','Need to buy?','Note','Product photo','How much was used?','Delete this product?','Saved','Error','Refresh','Expired'],
it:['Inventario','Prodotti in casa','Prodotti','In esaurimento','In scadenza','🔎 Cerca prodotti…','Tutti','Alimenti','Bevande','Igiene','Caricamento inventario…','Nessun prodotto.','Disponibile','Da comprare','Modifica','Elimina','Consuma','Aggiungi prodotto','Salva','Prodotto','Quantità','Unità','Categoria','Minimo','Scadenza','Stato','Da comprare?','Nota','Foto prodotto','Quanto è stato consumato?','Eliminare questo prodotto?','Salvato','Errore','Aggiorna','Scaduto'],
tr:['Stok','Evdeki ürünler','Ürünler','Azalanlar','Son kullanma tarihi','🔎 Ürün ara…','Tümü','Yiyecek','İçecek','Hijyen','Stok yükleniyor…','Ürün yok.','Stokta','Satın al','Düzenle','Sil','Tüket','Ürün ekle','Kaydet','Ürün','Miktar','Birim','Kategori','Minimum','Son kullanma tarihi','Durum','Alınacak mı?','Not','Ürün fotoğrafı','Ne kadar tüketildi?','Bu ürün silinsin mi?','Kaydedildi','Hata','Yenile','Süresi dolmuş'],
mk:['Инвентар','Производи во домот','Производи','При крај','Истекува рокот','🔎 Пребарај производ…','Сите','Храна','Пијалаци','Хигиена','Се вчитува инвентарот…','Нема производи.','На залиха','За купување','Измени','Избриши','Потроши','Додај производ','Зачувај','Производ','Количина','Единица','Категорија','Минимум','Рок на траење','Статус','Да се купи?','Белешка','Фотографија','Колку е потрошено?','Да се избрише производот?','Зачувано','Грешка','Освежи','Истечен рок'],
bs:['Zalihe','Proizvodi u kući','Proizvodi','Pri kraju','Ističe rok','🔎 Pretraži proizvod…','Sve','Hrana','Pića','Higijena','Učitavanje zaliha…','Nema proizvoda.','Na zalihi','Za kupovinu','Uredi','Obriši','Potroši','Dodaj proizvod','Sačuvaj','Proizvod','Količina','Jedinica','Kategorija','Minimum','Rok trajanja','Status','Treba kupiti?','Napomena','Fotografija proizvoda','Koliko je potrošeno?','Obrisati ovaj proizvod?','Sačuvano','Greška','Osvježi','Istekao rok']};
const dict=Object.fromEntries(Object.entries(translations).map(([l,v])=>[l,Object.fromEntries(keys.map((k,i)=>[k,v[i]]))]));let language=localStorage.getItem('mh_language')||localStorage.getItem('lang')||'sq';if(!dict[language])language='sq';let inventory=[],photoIndex=new Map(),photoCache=new Map(),filter='ALL',loaded=false,request=null,editing=null,photoData='';
const t=k=>dict[language][k]||dict.sq[k]||k,esc=v=>String(v??'').replace(/[&<>"']/g,c=>String.fromCharCode(38)+'#'+c.charCodeAt(0)+';');
function token(){for(const store of [sessionStorage,localStorage])for(const k of ['sessionToken','mh_token','token','mh_session_token']){try{const v=store.getItem(k);if(v)return v}catch(e){}}return ''}
async function api(action,data={}){const payload={action,...data};const tk=token();if(tk)payload.token=tk;const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const raw=(await r.text()).replace(/^\uFEFF/,'').trim();let j;try{j=JSON.parse(raw)}catch(e){throw Error('SERVER_NOT_JSON')}if(j?.ok===false)throw Error(j.error||'SERVER_ERROR');return Object.hasOwn(j,'data')?j.data:j}
const arr=x=>Array.isArray(x)?x:Array.isArray(x?.items)?x.items:Array.isArray(x?.data)?x.data:[];
const num=x=>{if(typeof x==='number')return x;const v=Number(String(x??0).replace(',','.'));return Number.isFinite(v)?v:0};
const norm=x=>({id:x.ID||x.id||'',productKey:x.productKey||String(x.Produkti||x.product||'').toLowerCase().trim(),name:x.Produkti||x.product||'',category:x.Kategoria||x.category||'',quantity:num(x.Sasia??x.quantity),unit:x['Njësia']||x.unit||'copë',minimum:num(x.Minimumi??x.minimum),status:x.Statusi||x.status||'',needBuy:x['Duhet blerë']||x.needBuy||'',note:x['Shënim']||x.note||'',lastPrice:x.lastPrice||'',lastStore:x.lastStore||'',expiry:x.expiryDate||''});
function days(v){if(!v)return null;const d=new Date(String(v).slice(0,10)+'T00:00:00');if(Number.isNaN(d.getTime()))return null;const now=new Date();now.setHours(0,0,0,0);return Math.round((d-now)/86400000)}
function icon(c){if(/pije|geträn|drink/i.test(c))return'🥤';if(/hig|pflege/i.test(c))return'🧴';if(/ushq|lebens|food/i.test(c))return'🥫';return'📦'}
function changeLang(v){language=dict[v]?v:'sq';localStorage.setItem('mh_language',language);localStorage.setItem('lang',language);$('lang').value=language;document.documentElement.lang=language;$('title').textContent=t('title');$('subtitle').textContent=t('subtitle');$('sProducts').textContent=t('products');$('sLow').textContent=t('low');$('sExpiry').textContent=t('expiry');$('search').placeholder=t('search');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('saveBtn').textContent='💾 '+t('save');$('modalTitle').textContent=(editing?'✏️ ':'➕ ')+t(editing?'edit':'add');const fs=[['ALL','all','📦'],['LOW','low','⚠️'],['EXPIRY','expiry','⏰'],['FOOD','food','🥫'],['DRINK','drink','🥤'],['HYGIENE','hygiene','🧴']];$('filters').innerHTML=fs.map(([id,key,em])=>`<button class="filter ${filter===id?'active':''}" data-filter="${id}">${em} ${esc(t(key))}</button>`).join('');if(loaded)render()}
function isLow(i){return i.quantity<=i.minimum||String(i.needBuy).toLowerCase()==='po'}
function filtered(){const q=$('search').value.toLowerCase().trim();return inventory.filter(i=>{if(q&&!`${i.name} ${i.category} ${i.note} ${i.lastStore}`.toLowerCase().includes(q))return false;if(filter==='LOW')return isLow(i);if(filter==='EXPIRY'){const d=days(i.expiry);return d!==null&&d<=7}if(filter==='FOOD')return/ushq|lebens|food/i.test(i.category);if(filter==='DRINK')return/pije|geträn|drink/i.test(i.category);if(filter==='HYGIENE')return/hig|pflege/i.test(i.category);return true})}
function render(){if(!loaded)return;$('totalCount').textContent=inventory.length;$('lowCount').textContent=inventory.filter(isLow).length;$('expiryCount').textContent=inventory.filter(i=>{const d=days(i.expiry);return d!==null&&d>=0&&d<=7}).length;const items=filtered();$('status').textContent=inventory.length+' '+t('products');$('list').innerHTML=items.length?items.map(i=>{const d=days(i.expiry),key=esc(i.productKey);return `<article class="item"><div class="placeholder" data-photo="${key}">${icon(i.category)}</div><div><div class="name">${esc(i.name)}</div><div class="meta">${esc(i.category)} ${i.lastStore?'· '+esc(i.lastStore):''}</div>${isLow(i)?`<span class="badge">⚠️ ${esc(t('buy'))}</span>`:''}${d!==null&&d<=7?`<span class="badge">⏰ ${d<0?esc(t('expired')):d+' d'}</span>`:''}<div class="actions"><button data-action="consume" data-id="${esc(i.id)}">➖ ${esc(t('consume'))}</button><button data-action="edit" data-id="${esc(i.id)}">✏️ ${esc(t('edit'))}</button><button class="danger" data-action="delete" data-id="${esc(i.id)}">🗑️ ${esc(t('del'))}</button></div></div><div class="qty">${esc(i.quantity)}<div class="meta">${esc(i.unit)}</div></div></article>`}).join(''):`<div class="msg">${esc(t('empty'))}</div>`;hydratePhotos()}
function hydratePhotos(){for(const el of document.querySelectorAll('[data-photo]')){const key=el.dataset.photo,id=photoIndex.get(key);if(!id)continue;if(photoCache.has(id)){el.outerHTML=`<img class="photo" alt="" src="${photoCache.get(id)}">`;continue}el.dataset.fileId=id;photoObserver.observe(el)}}
const photoObserver=new IntersectionObserver(entries=>{for(const e of entries){if(!e.isIntersecting)continue;photoObserver.unobserve(e.target);const id=e.target.dataset.fileId;if(!id)continue;api('productPhotoGet',{fileId:id}).then(data=>{if(typeof data==='string'&&data.startsWith('data:image/')){photoCache.set(id,data);document.querySelectorAll('[data-file-id]').forEach(el=>{if(el.dataset.fileId===id)el.outerHTML=`<img class="photo" alt="" src="${data}">`})}}).catch(()=>{})}},{rootMargin:'160px'});
async function load(){if(request)return request;request=(async()=>{if(!loaded)$('status').textContent=t('loading');try{const data=await api('inventoryList');inventory=arr(data).map(norm).filter(x=>x.name);loaded=true;render();api('dashboard').then(d=>{photoIndex=new Map((d?.products||[]).filter(x=>x.fileId).map(x=>[String(x.productKey||x.name||'').toLowerCase().trim(),x.fileId]));hydratePhotos()}).catch(()=>{})}catch(e){$('status').innerHTML=`<div class="error">⚠️ ${esc(e.message)}</div>`;if(!loaded)$('list').innerHTML=''}})().finally(()=>{request=null});return request}
function reset(){editing=null;photoData='';$('productName').value='';$('quantity').value='1';$('unit').value='copë';$('category').value='Ushqime';$('minimum').value='1';$('expiry').value='';$('itemStatus').value='';$('needBuy').value='';$('note').value='';$('photoInput').value='';$('preview').style.display='none';$('saveMsg').textContent=''}
function openModal(i){reset();if(i){editing=i;$('productName').value=i.name;$('quantity').value=i.quantity;$('unit').value=i.unit;$('category').value=i.category;$('minimum').value=i.minimum;$('expiry').value=String(i.expiry||'').slice(0,10);$('itemStatus').value=i.status;$('needBuy').value=i.needBuy;$('note').value=i.note}$('modalTitle').textContent=(editing?'✏️ ':'➕ ')+t(editing?'edit':'add');$('modal').classList.add('show')}
async function fileData(f){if(!f)return'';const img=new Image(),u=URL.createObjectURL(f);try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=u});const s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.78)}finally{URL.revokeObjectURL(u)}}
async function save(){const name=$('productName').value.trim(),q=Number($('quantity').value);if(!name||!Number.isFinite(q)||q<0)return;$('saveBtn').disabled=true;$('saveMsg').textContent='⏳';try{await api('inventorySave',{product:name,quantity:q,unit:$('unit').value,category:$('category').value,minimum:num($('minimum').value),expiryDate:$('expiry').value,status:$('itemStatus').value,needBuy:$('needBuy').value,note:$('note').value,lastPrice:editing?.lastPrice||'',lastStore:editing?.lastStore||''});if(photoData){const result=await api('productPhotoSave',{name,dataUrl:photoData,category:$('category').value});if(result?.fileId){photoIndex.set(name.toLowerCase().trim(),result.fileId);photoCache.set(result.fileId,photoData)}}$('saveMsg').textContent='✓ '+t('saved');await load();$('modal').classList.remove('show')}catch(e){$('saveMsg').textContent='⚠️ '+e.message}finally{$('saveBtn').disabled=false}}
async function ensureShopping(i){const d=await api('shoppingList'),rows=arr(d);if(rows.some(x=>String(x.status||'open').toLowerCase()==='open'&&String(x.Produkti||x.product||'').toLowerCase()===i.name.toLowerCase()))return;await api('shoppingAdd',{product:i.name,quantity:Math.max(1,i.minimum||1),unit:i.unit,priority:'high',source:'inventory_low',storeHint:i.lastStore||''})}
async function consume(i){const raw=prompt(t('consPrompt'),'1');if(raw===null)return;const used=Number(raw.replace(',','.'));if(!Number.isFinite(used)||used<=0)return;const q=Math.max(0,i.quantity-used),low=q<=i.minimum;try{await api('inventorySave',{product:i.name,quantity:q,unit:i.unit,category:i.category,minimum:i.minimum,expiryDate:i.expiry,status:q===0?'Mbaruar':low?'Po mbaron':'Në stok',needBuy:low?'Po':'',note:i.note,lastPrice:i.lastPrice,lastStore:i.lastStore});await load();if(low)ensureShopping(i).catch(e=>alert('⚠️ '+e.message))}catch(e){alert('⚠️ '+e.message)}}
async function remove(i){if(!confirm(t('deletePrompt')))return;try{await api('inventoryDelete',{id:i.id});await load()}catch(e){alert('⚠️ '+e.message)}}
$('lang').addEventListener('change',e=>changeLang(e.target.value));$('search').addEventListener('input',render);$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;filter=b.dataset.filter;changeLang(language)});$('addBtn').onclick=()=>openModal();$('closeBtn').onclick=()=>$('modal').classList.remove('show');$('saveBtn').onclick=save;$('photoInput').onchange=async e=>{try{photoData=await fileData(e.target.files[0]);$('preview').src=photoData;$('preview').style.display='block'}catch(err){$('saveMsg').textContent='⚠️ '+err.message}};$('list').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const i=inventory.find(x=>String(x.id)===b.dataset.id);if(!i)return;if(b.dataset.action==='edit')openModal(i);if(b.dataset.action==='consume')consume(i);if(b.dataset.action==='delete')remove(i)});changeLang(language);load();
</script></body></html>
