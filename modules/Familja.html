<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Familja / Familie</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#F4F7FC;color:#152238}body{padding-bottom:55px}.wrap{max-width:900px;margin:auto;padding:12px}
.hero{background:linear-gradient(135deg,#1269D3,#258CF0);color:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 28px #1269d329}.heroTop{display:flex;gap:13px;align-items:center}.heroIcon{width:60px;height:60px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 0;font-size:13px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#ffffff1c;border:1px solid #ffffff35;border-radius:14px;padding:10px;text-align:center}.stat span{display:block;font-size:9px}.stat strong{display:block;font-size:20px;margin-top:4px}
.toolbar{display:flex;gap:8px;margin:12px 0}.add{flex:1;border:0;border-radius:14px;padding:13px;background:#18A75B;color:#fff;font-weight:900}.refresh{width:50px;border:0;border-radius:14px;background:#fff;color:#1677E8;font-size:20px}.search{width:100%;border:1px solid #D8E3F0;background:#fff;border-radius:14px;padding:12px 14px;font-size:14px}
.list{display:grid;gap:10px;margin-top:12px}.member{background:#fff;border-radius:18px;padding:13px;box-shadow:0 8px 24px #162f5017;display:grid;grid-template-columns:54px minmax(0,1fr);gap:11px}.avatar{width:54px;height:54px;border-radius:50%;background:#EAF3FF;display:flex;align-items:center;justify-content:center;font-size:29px}.memberTop{display:flex;justify-content:space-between;gap:8px}.name{font-weight:900;font-size:15px}.role{background:#EAF3FF;color:#1269D3;padding:5px 8px;border-radius:10px;font-size:10px;font-weight:900}.linked{display:inline-block;margin-top:5px;background:#E7F8EE;color:#168445;padding:4px 7px;border-radius:8px;font-size:9px;font-weight:900}.pending{display:inline-block;margin-top:5px;background:#FFF4D9;color:#A96300;padding:4px 7px;border-radius:8px;font-size:9px;font-weight:900}.meta{font-size:11px;color:#718096;line-height:1.6;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #EDF1F6}.actions button{border:0;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:900}.edit{background:#E9F3FF;color:#1269D3}.del{background:#FFEAEA;color:#C62828}.invite{background:#E7F8EE;color:#168445}
.empty{background:#fff;border-radius:18px;padding:38px 15px;text-align:center;color:#718096}.error{background:#FFEAEA;color:#B42318;border-radius:13px;padding:12px;font-size:13px;font-weight:800;text-align:center;margin:10px 0}.loader{width:32px;height:32px;margin:30px auto;border:4px solid #DCE7F4;border-top-color:#1677E8;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.modal{display:none;position:fixed;inset:0;z-index:9999;background:#041123bd;padding:14px;overflow:auto}.modal.show{display:block}.modalBox{max-width:520px;margin:15px auto;background:#fff;border-radius:22px;padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalHead h2{margin:0;font-size:20px}.close{width:40px;height:40px;border:0;border-radius:50%;background:#EDF2F7;font-size:22px}
.field{margin-bottom:10px}.field label{display:block;margin:0 0 5px 3px;color:#526176;font-size:11px;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid #D7E1EE;border-radius:12px;padding:12px;font-size:14px;background:#fff}.field textarea{min-height:70px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{width:100%;border:0;border-radius:13px;padding:14px;background:#1677E8;color:#fff;font-size:15px;font-weight:900}.msg{text-align:center;padding:8px;font-size:12px;font-weight:800}.hint{background:#F0F6FF;border-radius:12px;padding:10px;font-size:11px;color:#526176;line-height:1.5;margin-bottom:10px}@media(max-width:430px){.two{grid-template-columns:1fr}}
</style><script>(function(){try{const l=localStorage.getItem('lang')||localStorage.getItem('mh_language')||'sq';localStorage.setItem('lang',l);localStorage.setItem('mh_language',l)}catch(e){}})();</script></head>
<body><nav style="padding:10px;background:#fff"><a href="../index.html" style="color:#075ab5;text-decoration:none;font:600 15px Arial">‹ MeinHaushalt FT</a></nav><div class="wrap">
<div class="hero"><div class="heroTop"><div class="heroIcon">👨‍👩‍👧‍👦</div><div><h1 id="pageTitle">Familja</h1><p id="pageSub">Familie • Anëtarët e familjes</p></div></div>
<div class="stats"><div class="stat"><span>ANËTARË</span><strong id="total">0</strong></div><div class="stat"><span>ADMIN</span><strong id="admins">0</strong></div><div class="stat"><span>FËMIJË</span><strong id="children">0</strong></div></div></div>
<div class="toolbar"><button class="add" onclick="openAdd()">＋ Shto anëtar / Mitglied hinzufügen</button><button class="refresh" onclick="loadMembers()">↻</button></div>
<input id="search" class="search" placeholder="🔎 Kërko anëtar..." oninput="render()"><div id="error"></div><div id="list" class="list"><div class="loader"></div></div></div>

<div id="modal" class="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle">👤 Shto anëtar</h2><button class="close" onclick="closeModal()">×</button></div>
<input type="hidden" id="memberId"><input type="hidden" id="linkedUserId">
<div class="two"><div class="field"><label>Emri / Vorname *</label><input id="firstName"></div><div class="field"><label>Mbiemri / Nachname</label><input id="lastName"></div></div>
<div class="field"><label>Email *</label><input id="email" type="email" autocomplete="email"></div>
<div class="hint">📧 Emaili përdoret për ftesën dhe lidhjen e llogarisë së anëtarit me këtë familje. Mbiemri nuk përdoret si identifikues unik.</div>
<div class="field"><label>Telefoni / Telefon</label><input id="phone" type="tel"></div>
<div class="two"><div class="field"><label>Roli / Rolle</label><select id="role"><option value="member">Anëtar / Mitglied</option><option value="admin">Admin</option><option value="child">Fëmijë / Kind</option></select></div>
<div class="field"><label>Lidhja / Beziehung</label><select id="relationship"><option value="">—</option><option value="Vater">Babai / Vater</option><option value="Mutter">Nëna / Mutter</option><option value="Sohn">Djali / Sohn</option><option value="Tochter">Vajza / Tochter</option><option value="Partner">Partner</option><option value="Andere">Tjetër / Andere</option></select></div></div>
<div class="two"><div class="field"><label>Datëlindja / Geburtsdatum</label><input id="birthDate" type="date"></div><div class="field"><label>Gjinia / Geschlecht</label><select id="gender"><option value="">—</option><option value="male">Mashkull / Männlich</option><option value="female">Femër / Weiblich</option></select></div></div>
<div class="field"><label>Shënim / Notiz</label><textarea id="note"></textarea></div><button class="save" onclick="saveMember()">💾 Ruaj / Speichern</button><div id="msg" class="msg"></div></div></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';
let members=[];
function token(){return localStorage.getItem('sessionToken')||localStorage.getItem('token')||''}
async function api(action,data={}){if(!token())throw Error('LOGIN_REQUIRED');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:token(),...data})});const t=(await r.text()).replace(/^\uFEFF/,'').trim();if(!t)throw Error('EMPTY_RESPONSE');let j;try{j=JSON.parse(t)}catch(e){throw Error('INVALID_RESPONSE')}if(j.ok===false)throw Error(j.error||'SERVER_ERROR');return j}
function rows(r){if(Array.isArray(r))return r;if(Array.isArray(r.data))return r.data;if(Array.isArray(r.data?.items))return r.data.items;return []}
function esc(v){return String(v??'').replace(/&/g,String.fromCharCode(38)+'amp;').replace(/</g,String.fromCharCode(38)+'lt;').replace(/>/g,String.fromCharCode(38)+'gt;').replace(/"/g,String.fromCharCode(38)+'quot;').replace(/'/g,String.fromCharCode(38)+'#39;')}
function memberName(m){return m.displayName||[m.firstName,m.lastName].filter(Boolean).join(' ')||m.name||'Anëtar'}
async function loadMembers(){document.getElementById('list').innerHTML='<div class="loader"></div>';document.getElementById('error').innerHTML='';try{let r;try{r=await api('members')}catch(e){r=await api('family')}members=rows(r);render()}catch(e){document.getElementById('error').innerHTML='<div class="error">⚠️ '+esc(e.message)+'</div>';members=[];render()}}
function render(){const q=document.getElementById('search').value.toLowerCase();document.getElementById('total').textContent=members.length;document.getElementById('admins').textContent=members.filter(x=>['admin','owner'].includes(String(x.role).toLowerCase())).length;document.getElementById('children').textContent=members.filter(x=>String(x.role).toLowerCase()==='child').length;const data=members.filter(m=>[memberName(m),m.email,m.phone,m.role,m.relation,m.relationship].join(' ').toLowerCase().includes(q));const box=document.getElementById('list');if(!data.length){box.innerHTML='<div class="empty">👨‍👩‍👧‍👦<br><br>Nuk ka anëtarë.</div>';return}box.innerHTML=data.map(m=>{const id=m.memberId||m.userId||'';const linked=!!m.userId;return `<div class="member"><div class="avatar">${String(m.gender)==='female'?'👩':String(m.role)==='child'?'🧒':'👤'}</div><div><div class="memberTop"><div class="name">${esc(memberName(m))}</div><span class="role">${esc(m.role||'member')}</span></div>${linked?'<span class="linked">✓ Llogaria e lidhur</span>':'<span class="pending">⏳ Pa llogari të lidhur</span>'}<div class="meta">${(m.relation||m.relationship)?'👨‍👩‍👧 '+esc(m.relation||m.relationship):''}${m.email?'<br>✉️ '+esc(m.email):''}${m.phone?'<br>📞 '+esc(m.phone):''}${m.birthDate?'<br>🎂 '+esc(m.birthDate):''}</div><div class="actions"><button class="edit" data-edit="${esc(id)}">✏️ Ndrysho</button>${!linked&&m.email?'<button class="invite" data-invite="'+esc(id)+'">✉️ Ftesë</button>':''}<button class="del" data-del="${esc(id)}">🗑️ Fshi</button></div></div></div>`}).join('');
box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMember(b.dataset.edit));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteMember(b.dataset.del));box.querySelectorAll('[data-invite]').forEach(b=>b.onclick=()=>createInvite(b.dataset.invite))}
function openAdd(){['memberId','linkedUserId','firstName','lastName','email','phone','birthDate','note'].forEach(id=>document.getElementById(id).value='');document.getElementById('role').value='member';document.getElementById('relationship').value='';document.getElementById('gender').value='';document.getElementById('msg').textContent='';document.getElementById('modalTitle').textContent='👤 Shto anëtar';document.getElementById('modal').classList.add('show')}
function editMember(id){const m=members.find(x=>String(x.memberId||x.userId||'')===String(id));if(!m)return;document.getElementById('memberId').value=m.memberId||'';document.getElementById('linkedUserId').value=m.userId||'';document.getElementById('firstName').value=m.firstName||'';document.getElementById('lastName').value=m.lastName||'';document.getElementById('email').value=m.email||'';document.getElementById('phone').value=m.phone||'';document.getElementById('role').value=m.role||'member';document.getElementById('relationship').value=m.relation||m.relationship||'';document.getElementById('birthDate').value=m.birthDate||'';document.getElementById('gender').value=m.gender||'';document.getElementById('note').value=m.note||'';document.getElementById('msg').textContent='';document.getElementById('modalTitle').textContent='✏️ Ndrysho anëtarin';document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
async function saveMember(){const msg=document.getElementById('msg'),firstName=document.getElementById('firstName').value.trim(),email=document.getElementById('email').value.trim().toLowerCase();if(!firstName){msg.textContent='⚠️ Shkruaj emrin.';return}if(!email){msg.textContent='⚠️ Shkruaj emailin e anëtarit.';return}msg.textContent='Duke ruajtur...';try{const payload={memberId:document.getElementById('memberId').value,userId:document.getElementById('linkedUserId').value,firstName,lastName:document.getElementById('lastName').value.trim(),email,phone:document.getElementById('phone').value.trim(),role:document.getElementById('role').value,relation:document.getElementById('relationship').value,birthDate:document.getElementById('birthDate').value,gender:document.getElementById('gender').value,note:document.getElementById('note').value.trim()};await api('familyMemberSave',payload);msg.textContent='✅ Anëtari u ruajt.';await loadMembers();setTimeout(closeModal,500)}catch(e){msg.textContent='⚠️ '+String(e.message||e)}}
async function createInvite(id){const m=members.find(x=>String(x.memberId||'')===String(id));if(!m||!m.email){alert('Ky anëtar nuk ka email të ruajtur në backend.');return}try{const r=await api('inviteCreate',{email:m.email,role:m.role||'member'});const d=r.data||r;const inviteToken=d.inviteToken||'';if(inviteToken){try{await navigator.clipboard.writeText(inviteToken)}catch(e){}alert('Ftesa u krijua. Kodi i ftesës u kopjua kur pajisja e lejon.')}else alert('Ftesa u krijua.')}catch(e){alert(String(e.message||e))}}
async function deleteMember(id){if(!confirm('Ta largojmë këtë anëtar?\\nMitglied entfernen?'))return;try{await api('familyMemberDelete',{memberId:id});await loadMembers()}catch(e){alert(String(e.message||e))}}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
(async()=>{if(!token()){document.getElementById('list').innerHTML='';document.getElementById('error').innerHTML='<div class="error">🔐 Duhet të jesh i kyçur në profil.</div>';return}await loadMembers()})();
</script></body></html>
