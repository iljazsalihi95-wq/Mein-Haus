<!DOCTYPE html>
<html lang="sq"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Detyrat / Aufgaben</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7fc;color:#152238}body{padding-bottom:80px}.wrap{max-width:950px;margin:auto;padding:12px}.hero{background:linear-gradient(135deg,#1269d3,#258cf0);color:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 30px #1269d340}.heroTop{display:flex;align-items:center;gap:13px}.heroIcon{width:58px;height:58px;border-radius:17px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}.hero h1{margin:0;font-size:26px}.hero p{margin:5px 0 0;font-size:13px;opacity:.9}.lang{margin-left:auto;border:0;border-radius:10px;padding:8px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}.stat{background:#ffffff1d;border:1px solid #ffffff35;border-radius:14px;padding:10px 5px;text-align:center}.stat span{font-size:10px;display:block}.stat strong{font-size:20px;display:block;margin-top:3px}.next{margin:12px 0;background:#fff;border-radius:18px;padding:14px;box-shadow:0 12px 28px #162f501c;border:1px solid #e0e9f4}.next.urgent{border-color:#f0a0a0;box-shadow:0 12px 30px #c6282822}.next small{font-weight:900;color:#1677e8}.next h3{margin:6px 0}.addbar{display:flex;gap:8px;margin:12px 0}.add{flex:1;border:0;border-radius:14px;padding:13px;background:#18a75b;color:#fff;font-weight:900;font-size:15px}.refresh{width:50px;border:0;border-radius:14px;background:#fff;color:#1677e8;font-size:21px;box-shadow:0 4px 14px #162f5015}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.filter{border:1px solid #d8e3f0;background:#fff;color:#526176;border-radius:22px;padding:9px 13px;white-space:nowrap;font-weight:800}.filter.active{background:#1677e8;color:#fff}.search{width:100%;border:1px solid #d8e3f0;background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:11px}.status{font-size:11px;color:#718096;margin:4px 3px 9px}.list{display:grid;gap:10px}.task{background:#fff;border-radius:18px;padding:13px;box-shadow:0 10px 24px #162f5017;display:grid;grid-template-columns:48px minmax(0,1fr);gap:11px}.task.done{opacity:.62}.task.done .taskTitle{text-decoration:line-through}.check{width:46px;height:46px;border-radius:14px;border:0;background:#eaf3ff;color:#1677e8;font-size:23px;font-weight:900}.done .check{background:#ddf7e7;color:#159447}.taskTitle{font-size:16px;font-weight:900}.meta{font-size:11px;color:#718096;margin-top:5px;line-height:1.5}.person{display:inline-block;margin-top:6px;background:#edf5ff;color:#1269d3;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:900}.priority{display:inline-block;border-radius:7px;padding:3px 7px;font-size:9px;font-weight:900;margin-left:5px}.high{background:#ffe7e7;color:#c62828}.normal{background:#e9f3ff;color:#1269d3}.low{background:#e7f8ed;color:#168445}.actions{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid #edf1f6}.actions button{border:0;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:900}.edit{background:#e9f3ff;color:#1269d3}.del{background:#ffeaea;color:#c62828}.empty{background:#fff;border-radius:18px;padding:35px 15px;text-align:center;color:#718096}.loader{width:32px;height:32px;margin:30px auto;border:4px solid #dce7f4;border-top-color:#1677e8;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{background:#ffeaea;color:#b42318;border-radius:13px;padding:12px;font-size:13px;font-weight:800;text-align:center;margin-bottom:10px}.modal{display:none;position:fixed;inset:0;z-index:9999;background:#041123b8;padding:15px;overflow:auto}.modal.show{display:block}.modalBox{max-width:520px;margin:15px auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 22px 55px #0005}.modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{width:41px;height:41px;border:0;border-radius:50%;font-size:22px}.field{margin-bottom:10px}.field label{display:block;margin:0 0 5px 3px;color:#526176;font-size:12px;font-weight:900}.field input,.field select,.field textarea{width:100%;border:1px solid #d7e1ee;border-radius:12px;padding:12px;font-size:15px;background:#fff}.field textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save{width:100%;border:0;border-radius:13px;padding:14px;background:#1677e8;color:#fff;font-size:16px;font-weight:900}.message{text-align:center;padding:9px;font-size:13px;font-weight:800}@media(max-width:400px){.two{grid-template-columns:1fr}}
</style><script>(function(){try{const l=localStorage.getItem('lang')||localStorage.getItem('mh_language')||'sq';localStorage.setItem('lang',l);localStorage.setItem('mh_language',l)}catch(e){}})();</script></head><body><nav style="padding:10px;background:#fff"><a href="../index.html" style="color:#075ab5;text-decoration:none;font:600 15px Arial">‹ MeinHaushalt FT</a></nav><div class="wrap">
<div class="hero"><div class="heroTop"><div class="heroIcon">✅</div><div><h1 id="heroTitle">Detyrat</h1><p id="heroSub">Organizimi i familjes</p></div><select id="lang" class="lang" onchange="setLang(this.value)"><option value="de">DE</option><option value="sq">SQ</option><option value="en">EN</option></select></div><div class="stats"><div class="stat"><span id="labOpen">HAPUR</span><strong id="openCount">0</strong></div><div class="stat"><span id="labDone">KRYER</span><strong id="doneCount">0</strong></div><div class="stat"><span id="labTotal">GJITHSEJ</span><strong id="totalCount">0</strong></div></div></div>
<div id="nextTask" class="next"><small id="nextLabel">DETYRA MË E AFËRT</small><div id="nextContent">—</div></div>
<div class="addbar"><button id="addButton" class="add" onclick="openAdd()">＋ Shto detyrë</button><button class="refresh" onclick="loadTasks()">↻</button></div>
<div class="filters"><button id="fOpen" class="filter active" onclick="setFilter('open',this)">📋 Të hapura</button><button id="fMine" class="filter" onclick="setFilter('mine',this)">👤 Të miat</button><button id="fDone" class="filter" onclick="setFilter('done',this)">✅ Të kryera</button><button id="fAll" class="filter" onclick="setFilter('all',this)">Të gjitha</button></div>
<input id="search" class="search" oninput="render()"><div id="errorBox"></div><div id="status" class="status"></div><div id="list" class="list"><div class="loader"></div></div></div>
<div id="modal" class="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle">✅ Detyrë e re</h2><button class="close" onclick="closeModal()">×</button></div><input type="hidden" id="taskId"><div class="field"><label>Detyra / Aufgabe</label><input id="taskTitle"></div><div class="field"><label>Caktoja / Zuweisen</label><select id="assignedTo"><option value="">Familja / Familie</option></select></div><div class="two"><div class="field"><label>Data / Datum</label><input id="dueDate" type="date"></div><div class="field"><label>Ora / Uhrzeit</label><input id="dueTime" type="time"></div></div><div class="field"><label>Prioriteti / Priorität</label><select id="priority"><option value="normal">🔵 Normal</option><option value="high">🔴 Hoch / I lartë</option><option value="low">🟢 Niedrig / I ulët</option></select></div><div class="field"><label>Shënime / Notizen</label><textarea id="notes"></textarea></div><button id="saveButton" class="save" onclick="saveTask()">💾 Ruaj</button><div id="saveMessage" class="message"></div></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';let tasks=[],members=[],me={},filter='open';
const TXT={sq:{title:'Detyrat',sub:'Organizimi i familjes',open:'HAPUR',done:'KRYER',total:'GJITHSEJ',next:'DETYRA MË E AFËRT',add:'＋ Shto detyrë',fo:'📋 Të hapura',fm:'👤 Të miat',fd:'✅ Të kryera',fa:'Të gjitha',search:'🔎 Kërko detyrë...',empty:'Nuk ka detyra në këtë kategori.',family:'Familja',save:'Ruaj'},de:{title:'Aufgaben',sub:'Organisation der Familie',open:'OFFEN',done:'ERLEDIGT',total:'GESAMT',next:'NÄCHSTE AUFGABE',add:'＋ Neue Aufgabe',fo:'📋 Offen',fm:'👤 Meine',fd:'✅ Erledigt',fa:'Alle',search:'🔎 Aufgabe suchen...',empty:'Keine Aufgaben in dieser Kategorie.',family:'Familie',save:'Speichern'},en:{title:'Tasks',sub:'Family organization',open:'OPEN',done:'DONE',total:'TOTAL',next:'NEXT TASK',add:'＋ New task',fo:'📋 Open',fm:'👤 Mine',fd:'✅ Done',fa:'All',search:'🔎 Search task...',empty:'No tasks in this category.',family:'Family',save:'Save'}};
function language(){return localStorage.getItem('mh_language')||'de'}function t(){return TXT[language()]||TXT.en}function token(){return localStorage.getItem('sessionToken')||localStorage.getItem('token')||''}function esc(v){return String(v??'').replace(/&/g,String.fromCharCode(38)+'amp;').replace(/</g,String.fromCharCode(38)+'lt;').replace(/>/g,String.fromCharCode(38)+'gt;').replace(/"/g,String.fromCharCode(38)+'quot;').replace(/'/g,String.fromCharCode(38)+'#39;')}
async function api(action,data={}){if(!token())throw Error('LOGIN_REQUIRED');const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:token(),...data})}),raw=(await r.text()).replace(/^\uFEFF/,'').trim();if(!raw)throw Error('EMPTY_RESPONSE');const j=JSON.parse(raw);if(j.ok===false)throw Error(j.error||'SERVER_ERROR');return Object.prototype.hasOwnProperty.call(j,'data')?j.data:j}
function rows(r){if(Array.isArray(r))return r;if(Array.isArray(r?.items))return r.items;if(Array.isArray(r?.data))return r.data;return[]}function idOf(x){return x.itemId||x.ID||x.id||''}function titleOf(x){return x.Produkti||x.product||x.title||'Detyrë'}function done(x){return ['done','completed','erledigt'].includes(String(x.status||'open').toLowerCase())}
function normalize(x){return{...x,itemId:idOf(x),Produkti:titleOf(x),assignedTo:x.assignedTo||'',priority:x.priority||'normal',dueDate:String(x.targetDate||x.dueDate||'').slice(0,10),dueTime:String(x.offerId||x.dueTime||'').slice(0,5),notes:x.storeHint||x.notes||x.note||''}}
async function loadProfile(){try{me=await api('me')||{}}catch(e){me={}}}async function loadMembers(){try{members=rows(await api('members'));assignedTo.innerHTML='<option value="">'+esc(t().family)+'</option>'+members.map(m=>'<option value="'+esc(m.memberId||m.userId||'')+'">'+esc(m.displayName||[m.firstName,m.lastName].filter(Boolean).join(' ')||'Member')+'</option>').join('')}catch(e){members=[]}}
function memberName(id){if(!id)return t().family;const m=members.find(x=>String(x.memberId||x.userId)===String(id));return m?(m.displayName||[m.firstName,m.lastName].filter(Boolean).join(' ')||t().family):t().family}
async function loadTasks(){list.innerHTML='<div class="loader"></div>';errorBox.innerHTML='';try{tasks=rows(await api('shoppingList')).filter(x=>['task','aufgabe'].includes(String(x.source||'').toLowerCase())).map(normalize);status.textContent=tasks.length+' '+t().title.toLowerCase();render()}catch(e){tasks=[];render();errorBox.innerHTML='<div class="error">⚠️ '+esc(e.message)+'</div>'}}
function setFilter(f,b){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function mineId(){return me.memberId||me.userId||''}
function filtered(){const q=search.value.toLowerCase().trim();return tasks.filter(x=>{if(q&&!(titleOf(x)+' '+x.notes+' '+memberName(x.assignedTo)).toLowerCase().includes(q))return false;if(filter==='open')return !done(x);if(filter==='done')return done(x);if(filter==='mine')return mineId()&&String(x.assignedTo)===String(mineId());return true})}
function taskDate(x){if(!x.dueDate)return new Date('2999-12-31T23:59');return new Date(x.dueDate+'T'+(x.dueTime||'23:59'))}
function renderNext(){const x=tasks.filter(a=>!done(a)).sort((a,b)=>taskDate(a)-taskDate(b))[0];if(!x){nextContent.innerHTML='<div class="meta">'+esc(t().empty)+'</div>';nextTask.classList.remove('urgent');return}const overdue=x.dueDate&&taskDate(x)<new Date();nextTask.classList.toggle('urgent',!!overdue||x.priority==='high');nextContent.innerHTML='<h3>'+esc(titleOf(x))+'</h3><div class="meta">'+(x.dueDate?'📅 '+esc(x.dueDate):'')+(x.dueTime?' · ⏰ '+esc(x.dueTime):'')+'<br>👤 '+esc(memberName(x.assignedTo))+'</div>'}
function render(){openCount.textContent=tasks.filter(x=>!done(x)).length;doneCount.textContent=tasks.filter(done).length;totalCount.textContent=tasks.length;renderNext();const r=filtered().sort((a,b)=>taskDate(a)-taskDate(b));list.innerHTML=r.length?r.map(x=>{const d=done(x),p=String(x.priority||'normal').toLowerCase();return '<div class="task '+(d?'done':'')+'"><button class="check" data-toggle="'+esc(x.itemId)+'">'+(d?'✓':'○')+'</button><div><div class="taskTitle">'+esc(titleOf(x))+'<span class="priority '+(p==='high'?'high':p==='low'?'low':'normal')+'">'+esc(p.toUpperCase())+'</span></div><div class="person">👤 '+esc(memberName(x.assignedTo))+'</div><div class="meta">'+(x.dueDate?'📅 '+esc(x.dueDate):'')+(x.dueTime?' · ⏰ '+esc(x.dueTime):'')+(x.notes?'<br>📝 '+esc(x.notes):'')+'</div><div class="actions"><button class="edit" data-edit="'+esc(x.itemId)+'">✏️</button><button class="del" data-del="'+esc(x.itemId)+'">🗑️</button></div></div></div>'}).join(''):'<div class="empty">✅<br><br>'+esc(t().empty)+'</div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.toggle));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTask(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteTask(b.dataset.del))}
function clearForm(){taskId.value=taskTitle.value=dueDate.value=dueTime.value=notes.value='';assignedTo.value='';priority.value='normal';saveMessage.textContent=''}function openAdd(){clearForm();modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function editTask(id){const x=tasks.find(a=>a.itemId===id);if(!x)return;taskId.value=x.itemId;taskTitle.value=titleOf(x);assignedTo.value=x.assignedTo;dueDate.value=x.dueDate;dueTime.value=x.dueTime;priority.value=x.priority;notes.value=x.notes;modal.classList.add('show')}
async function saveTask(){const title=taskTitle.value.trim();if(!title){saveMessage.textContent='⚠️';return}const payload={product:title,assignedTo:assignedTo.value,priority:priority.value,dueDate:dueDate.value,dueTime:dueTime.value,notes:notes.value.trim(),source:'task'};try{if(taskId.value)await api('shoppingUpdate',{itemId:taskId.value,...payload});else await api('shoppingAdd',{...payload,quantity:1,unit:'detyrë',status:'open'});saveMessage.textContent='✅';await loadTasks();setTimeout(closeModal,350)}catch(e){saveMessage.textContent='⚠️ '+e.message}}
async function toggleTask(id){const x=tasks.find(a=>a.itemId===id);if(!x)return;try{await api('shoppingUpdate',{itemId:id,status:done(x)?'open':'done'});await loadTasks()}catch(e){alert(e.message)}}async function deleteTask(id){if(!confirm('Delete?'))return;try{await api('shoppingDelete',{itemId:id});await loadTasks()}catch(e){alert(e.message)}}
function applyLang(){const z=t();heroTitle.textContent=z.title;heroSub.textContent=z.sub;labOpen.textContent=z.open;labDone.textContent=z.done;labTotal.textContent=z.total;nextLabel.textContent=z.next;addButton.textContent=z.add;fOpen.textContent=z.fo;fMine.textContent=z.fm;fDone.textContent=z.fd;fAll.textContent=z.fa;search.placeholder=z.search;saveButton.textContent='💾 '+z.save;lang.value=language();loadMembers().then(render)}function setLang(v){localStorage.setItem('mh_language',v);applyLang()}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});(async()=>{applyLang();if(!token()){errorBox.innerHTML='<div class="error">🔐 LOGIN_REQUIRED</div>';list.innerHTML='';return}await loadProfile();await loadMembers();await loadTasks()})();
</script></body></html>
