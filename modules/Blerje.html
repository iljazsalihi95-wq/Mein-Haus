<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#061426;color:#fff}

<body><nav style="padding:10px;background:#fff"><a href="../index.html" style="color:#075ab5;text-decoration:none;font:600 15px Arial">‹ MeinHaushalt FT</a></nav><div class="app">
<div class="hero"><div class="heroTop"><div><h1 data-i="title">🛒 Blerjet</h1><div class="sub" data-i="subtitle">Kassenbon AI • Blerje manuale • Historik</div></div>
<select id="lang" style="width:auto;padding:9px"><option value="sq">SQ</option><option value="de">DE</option><option value="en">EN</option><option value="it">IT</option><option value="tr">TR</option><option value="mk">MK</option><option value="bs">BS</option></select></div></div>

<div class="card"><h2 data-i="receiptAI">📷 Kassenbon AI</h2><div class="scan">
<label class="fileBtn"><span data-i="camera">📷 Kamera</span><input id="camera" type="file" accept="image/*" capture="environment"></label>
<label class="fileBtn"><span data-i="photo">🖼️ Zgjidh foto</span><input id="gallery" type="file" accept="image/*"></label></div>
<img id="preview"><button id="scanBtn" style="margin-top:10px" disabled data-i="readReceipt">✨ Lexo faturën</button>
<div id="scanStatus" class="status"></div><div id="scanResult"></div></div>

<div class="card"><h2 data-i="manual">➕ Blerje manuale</h2><div class="grid">
<div><label data-i="date">Data</label><input id="date" type="date"></div><div><label data-i="time">Ora</label><input id="time" type="time"></div>
<div><label data-i="store">Dyqani</label><input id="store" placeholder="p.sh. Kaufland"></div><div><label data-i="product">Produkti</label><input id="product"></div>
<div><label data-i="qty">Sasia</label><input id="qty" type="number" min=".01" step=".01" value="1"></div><div><label data-i="unit">Njësia</label><select id="unit"><option>copë</option><option>kg</option><option>g</option><option>l</option><option>ml</option><option>paketë</option></select></div>
<div><label data-i="unitPrice">Çmimi njësi €</label><input id="unitPrice" type="number" min="0" step=".01"></div><div><label data-i="total">Totali €</label><input id="total" type="number" min="0" step=".01"></div>
<div><label data-i="category">Kategoria</label><input id="category" placeholder="Ushqime"></div><div><label data-i="payment">Pagesa</label><select id="payment"><option value="Cash">Cash</option><option value="Bank">Bank / Kartë</option></select></div>
<div class="full"><label data-i="note">Shënim</label><textarea id="note"></textarea></div><div class="full"><button id="saveBtn" data-i="save">💾 Ruaj blerjen</button></div></div><div id="saveStatus" class="status"></div></div>

<div class="card"><h2 data-i="history">🧾 Historiku i blerjeve</h2><button id="refreshBtn" class="secondary" data-i="refresh">↻ Rifresko</button><div id="history"><div class="empty">Duke ngarkuar…</div></div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxLAP0EW3Inecns-l3KIF5wPPAardgQnXSMrVJCEuZj6RtLofAOOwlQzFa1UCwsoKA/exec';
const $=id=>document.getElementById(id), token=()=>localStorage.getItem('sessionToken')||localStorage.getItem('mh_token')||localStorage.getItem('token')||localStorage.getItem('mh_session_token')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>String.fromCharCode(38)+'#'+c.charCodeAt(0)+';');
const T={
sq:{title:'🛒 Blerjet',subtitle:'Kassenbon AI • Blerje manuale • Historik',receiptAI:'📷 Kassenbon AI',camera:'📷 Kamera',photo:'🖼️ Zgjidh foto',readReceipt:'✨ Lexo faturën',manual:'➕ Blerje manuale',date:'Data',time:'Ora',store:'Dyqani',product:'Produkti',qty:'Sasia',unit:'Njësia',unitPrice:'Çmimi njësi €',total:'Totali €',category:'Kategoria',payment:'Pagesa',note:'Shënim',save:'💾 Ruaj blerjen',history:'🧾 Historiku i blerjeve',refresh:'↻ Rifresko',pass:'✅ Kasenboni përputhet',diff:'⚠️ Diferencë',duplicate:'♻️ Kasenboni ekziston – nuk u dublikua',inventory:'Inventari + Financat u përditësuan'},
de:{title:'🛒 Einkäufe',subtitle:'Kassenbon AI • Manueller Einkauf • Verlauf',receiptAI:'📷 Kassenbon AI',camera:'📷 Kamera',photo:'🖼️ Foto wählen',readReceipt:'✨ Bon lesen',manual:'➕ Manueller Einkauf',date:'Datum',time:'Uhrzeit',store:'Geschäft',product:'Produkt',qty:'Menge',unit:'Einheit',unitPrice:'Stückpreis €',total:'Gesamt €',category:'Kategorie',payment:'Zahlung',note:'Notiz',save:'💾 Einkauf speichern',history:'🧾 Einkaufsverlauf',refresh:'↻ Aktualisieren',pass:'✅ Kassenbon stimmt',diff:'⚠️ Differenz',duplicate:'♻️ Kassenbon bereits vorhanden – nicht doppelt gespeichert',inventory:'Vorrat + Finanzen aktualisiert'},
en:{title:'🛒 Purchases',subtitle:'Receipt AI • Manual purchase • History',receiptAI:'📷 Receipt AI',camera:'📷 Camera',photo:'🖼️ Choose photo',readReceipt:'✨ Read receipt',manual:'➕ Manual purchase',date:'Date',time:'Time',store:'Store',product:'Product',qty:'Quantity',unit:'Unit',unitPrice:'Unit price €',total:'Total €',category:'Category',payment:'Payment',note:'Note',save:'💾 Save purchase',history:'🧾 Purchase history',refresh:'↻ Refresh',pass:'✅ Receipt matches',diff:'⚠️ Difference',duplicate:'♻️ Receipt already exists – not duplicated',inventory:'Inventory + Finances updated'},
it:{title:'🛒 Acquisti',subtitle:'Scontrino AI • Acquisto manuale • Cronologia',receiptAI:'📷 Scontrino AI',camera:'📷 Fotocamera',photo:'🖼️ Scegli foto',readReceipt:'✨ Leggi scontrino',manual:'➕ Acquisto manuale',date:'Data',time:'Ora',store:'Negozio',product:'Prodotto',qty:'Quantità',unit:'Unità',unitPrice:'Prezzo unitario €',total:'Totale €',category:'Categoria',payment:'Pagamento',note:'Nota',save:'💾 Salva acquisto',history:'🧾 Cronologia acquisti',refresh:'↻ Aggiorna',pass:'✅ Scontrino corretto',diff:'⚠️ Differenza',duplicate:'♻️ Scontrino già registrato – nessun duplicato',inventory:'Inventario + Finanze aggiornati'},
tr:{title:'🛒 Alışverişler',subtitle:'Fiş AI • Manuel alışveriş • Geçmiş',receiptAI:'📷 Fiş AI',camera:'📷 Kamera',photo:'🖼️ Fotoğraf seç',readReceipt:'✨ Fişi oku',manual:'➕ Manuel alışveriş',date:'Tarih',time:'Saat',store:'Mağaza',product:'Ürün',qty:'Miktar',unit:'Birim',unitPrice:'Birim fiyat €',total:'Toplam €',category:'Kategori',payment:'Ödeme',note:'Not',save:'💾 Alışverişi kaydet',history:'🧾 Alışveriş geçmişi',refresh:'↻ Yenile',pass:'✅ Fiş tutarı eşleşiyor',diff:'⚠️ Fark',duplicate:'♻️ Fiş zaten kayıtlı – tekrar kaydedilmedi',inventory:'Stok + Finans güncellendi'},
mk:{title:'🛒 Купувања',subtitle:'Сметка AI • Рачно купување • Историја',receiptAI:'📷 Сметка AI',camera:'📷 Камера',photo:'🖼️ Избери слика',readReceipt:'✨ Прочитај сметка',manual:'➕ Рачно купување',date:'Датум',time:'Време',store:'Продавница',product:'Производ',qty:'Количина',unit:'Единица',unitPrice:'Единечна цена €',total:'Вкупно €',category:'Категорија',payment:'Плаќање',note:'Белешка',save:'💾 Зачувај',history:'🧾 Историја',refresh:'↻ Освежи',pass:'✅ Сметката се совпаѓа',diff:'⚠️ Разлика',duplicate:'♻️ Сметката веќе постои – нема дупликат',inventory:'Залиха + Финансии ажурирани'},
bs:{title:'🛒 Kupovine',subtitle:'Račun AI • Ručna kupovina • Historija',receiptAI:'📷 Račun AI',camera:'📷 Kamera',photo:'🖼️ Izaberi sliku',readReceipt:'✨ Pročitaj račun',manual:'➕ Ručna kupovina',date:'Datum',time:'Vrijeme',store:'Prodavnica',product:'Proizvod',qty:'Količina',unit:'Jedinica',unitPrice:'Jedinična cijena €',total:'Ukupno €',category:'Kategorija',payment:'Plaćanje',note:'Napomena',save:'💾 Sačuvaj kupovinu',history:'🧾 Historija kupovina',refresh:'↻ Osvježi',pass:'✅ Račun se poklapa',diff:'⚠️ Razlika',duplicate:'♻️ Račun već postoji – nije dupliran',inventory:'Zaliha + Finansije ažurirani'}
};
let LANG='sq'; function tr(k){return T[LANG]?.[k]||T.sq[k]||k}
function setLang(v){LANG=T[v]?v:'sq';localStorage.setItem('mh_language',LANG);localStorage.setItem('lang',LANG);$('lang').value=LANG;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i))}
async function api(action,data={}){const payload={action,...data};if(token())payload.token=token();let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload),redirect:'follow'});let text=await r.text(),j;try{j=JSON.parse(text)}catch(e){throw Error('SERVER_NOT_JSON')}if(!j||j.ok===false)throw Error(j?.error||'SERVER_ERROR');return j.data!==undefined?j.data:j}
function safeText(v){return v==null?'':String(v)} function safeDate(v){let s=safeText(v);return /^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):s}
function safeTime(v){let s=safeText(v);let m=s.match(/(\d{1,2}):(\d{2})/);return m?String(m[1]).padStart(2,'0')+':'+m[2]:''}
function num(v){if(typeof v==='number')return isFinite(v)?v:0;let s=String(v??'').replace(/[€\s]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.');let n=parseFloat(s);return isFinite(n)?n:0}
function rowsOf(r){if(Array.isArray(r))return r;if(!r||typeof r!=='object')return [];for(const k of ['items','rows','purchases','data','result']){if(Array.isArray(r[k]))return r[k];if(r[k]&&typeof r[k]==='object'){let z=rowsOf(r[k]);if(z.length)return z}}return []}
function normalizeItem(x){return {...x,name:safeText(x.name||x.product||x.Produkti),product:safeText(x.product||x.name||x.Produkti),quantity:num(x.quantity??x.Sasia??1)||1,unit:safeText(x.unit||x['Njësia']||x.Njesia),unitPrice:num(x.unitPrice??x.price??0),total:num(x.total??x.Totali??x.lineTotal??0)}}
function normalizeReceiptForApi(r){r=r&&r.data?r.data:r||{};return {...r,store:safeText(r.store||r.Dyqani),date:safeDate(r.date||r.receiptDate||r.Data),receiptDate:safeDate(r.receiptDate||r.date||r.Data),time:safeTime(r.time||r.Ora),receiptNo:safeText(r.receiptNo||r.receiptNumber||r.belegNr||r.bonNr||r.BonNr),total:num(r.total??r.receiptTotal??r.Gesamtbetrag),receiptTotal:num(r.receiptTotal??r.total??r.Gesamtbetrag),items:Array.isArray(r.items)?r.items.map(normalizeItem):[]}}
function localDate(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function localTime(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())}`}
$('date').value=localDate();$('time').value=localTime();

function canon(s){return safeText(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function receiptFingerprint(r){r=normalizeReceiptForApi(r);let its=r.items.map(x=>canon(x.name)+'@'+x.quantity+'@'+x.total.toFixed(2)).sort().join('|');return [canon(r.store),r.date,r.time,r.receiptNo,r.receiptTotal.toFixed(2),its].join('#')}
function purchaseFingerprint(g){let x=g[0]||{},its=g.map(z=>canon(z.Produkti||z.product)+'@'+num(z.Sasia??z.quantity??1)+'@'+num(z.Totali??z.total??0).toFixed(2)).sort().join('|');return [canon(x.Dyqani||x.store),safeDate(x.Data||x.date),safeTime(x.Ora||x.time),safeText(x.receiptNo||x.receiptNumber||x.belegNr||x.bonNr),g.reduce((s,z)=>s+num(z.Totali??z.total??0),0).toFixed(2),its].join('#')}
function checkReceipt(r){r=normalizeReceiptForApi(r);let lines=r.items.reduce((s,x)=>s+x.total,0),total=r.receiptTotal||r.total,diff=Math.round((lines-total)*100)/100;return {lines,total,diff,ok:Math.abs(diff)<.01}}
function checkHtml(c){return `<div class="check ${c.ok?'ok':'bad'}">${c.ok?tr('pass'):tr('diff')+' '+Math.abs(c.diff).toFixed(2)+' €'} · Σ ${c.lines.toFixed(2)} € / ${c.total.toFixed(2)} €</div>`}

let receiptImage='',scanData=null,currentGroups=[];
async function imageToDataURL(file){const img=new Image(),url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.78)}
async function chooseFile(file){if(!file)return;receiptImage=await imageToDataURL(file);$('preview').src=receiptImage;$('preview').style.display='block';$('scanBtn').disabled=false}
$('camera').onchange=e=>chooseFile(e.target.files[0]);$('gallery').onchange=e=>chooseFile(e.target.files[0]);
$('scanBtn').onclick=async()=>{let st=$('scanStatus');st.style.display='block';st.className='status';st.textContent='⏳';$('scanBtn').disabled=true;try{scanData=normalizeReceiptForApi(await api('householdAI',{task:'receipt_scan',imageDataUrl:receiptImage}));renderScan(scanData);st.classList.add('ok');st.textContent='✓'}catch(e){st.classList.add('danger');st.textContent='⚠️ '+e.message}finally{$('scanBtn').disabled=false}};
function findDuplicate(r){let fp=receiptFingerprint(r);return currentGroups.some(g=>purchaseFingerprint(g)===fp)||currentGroups.some(g=>{let x=g[0]||{},sameStore=canon(x.Dyqani||x.store)===canon(r.store),sameDate=safeDate(x.Data||x.date)===r.date,sameTotal=Math.abs(g.reduce((s,z)=>s+num(z.Totali??z.total??0),0)-r.receiptTotal)<.01;let rn=safeText(x.receiptNo||x.receiptNumber||x.belegNr||x.bonNr);return sameStore&&sameDate&&sameTotal&&(!r.receiptNo||!rn||r.receiptNo===rn)})}
function renderScan(r){let items=r.items||[],c=checkReceipt(r),dup=findDuplicate(r);$('scanResult').innerHTML=`<div class="receipt"><div class="receiptTop"><b>${esc(r.store||'Dyqan')}</b><b>${r.receiptTotal.toFixed(2)} €</b></div><div class="muted">${esc(r.date)} ${esc(r.time)} ${r.receiptNo?'• '+esc(r.receiptNo):''}</div><div class="items">${items.map(x=>`<div class="item"><span>${esc(x.name||'Produkt')} × ${x.quantity}</span><span>${x.total.toFixed(2)} €</span></div>`).join('')}</div>${checkHtml(c)}${dup?`<div class="check info">${tr('duplicate')}</div>`:''}<button id="confirmBtn" style="margin-top:10px" ${dup?'disabled':''}>${dup?tr('duplicate'):'✅ '+tr('save')}</button></div>`;if(!dup)$('confirmBtn').onclick=confirmReceipt}
async function confirmReceipt(){let r=normalizeReceiptForApi(scanData);await loadPurchases();if(findDuplicate(r)){renderScan(r);return}let b=$('confirmBtn');b.disabled=true;b.textContent='⏳';try{let out=await api('confirmScan',{scanId:safeText(r.scanId||r.id||receiptFingerprint(r)),receipt:r,paymentMethod:safeText(r.paymentMethod||'Cash'),receiptFingerprint:receiptFingerprint(r)});if(out?.alreadyConfirmed){b.textContent=tr('duplicate')}else{b.textContent='✓ '+tr('inventory');await loadPurchases()}}catch(e){b.disabled=false;b.textContent='⚠️ '+e.message}}

$('saveBtn').onclick=async()=>{let name=$('product').value.trim(),amount=num($('total').value),qty=num($('qty').value)||1,up=num($('unitPrice').value);if(!name){showSave('⚠️ '+tr('product'),true);return}let finalTotal=amount||qty*up;if(!finalTotal){showSave('⚠️ '+tr('total'),true);return}$('saveBtn').disabled=true;try{await api('purchaseSave',{date:$('date').value,time:$('time').value,store:$('store').value.trim(),product:name,quantity:qty,unit:$('unit').value,unitPrice:up||finalTotal/qty,total:finalTotal,category:$('category').value.trim()||'Blerje',paymentMethod:$('payment').value,note:$('note').value.trim(),addToInventory:true,postToFinance:true});showSave('✓ '+tr('inventory'),false);$('product').value='';$('unitPrice').value='';$('total').value='';$('note').value='';await loadPurchases()}catch(e){showSave('⚠️ '+e.message,true)}finally{$('saveBtn').disabled=false}};
function showSave(t,bad){let x=$('saveStatus');x.style.display='block';x.className='status '+(bad?'danger':'ok');x.textContent=t}
function purchaseKey(x){return x.receiptScanId||x.receiptId||x.scanId||x.receiptNumber||x.BonNr||[safeDate(x.Data||x.date),safeTime(x.Ora||x.time),x.Dyqani||x.store,x.createdAt||''].join('|')}
function groupCheck(g){let x=g[0]||{},sum=g.reduce((s,z)=>s+num(z.Totali??z.total??0),0),expected=num(x.receiptTotal??x.Gesamtbetrag??x.KassenbonTotal??x.receipt_total);if(!expected)return {known:false,lines:sum};let diff=Math.round((sum-expected)*100)/100;return {known:true,ok:Math.abs(diff)<.01,lines:sum,total:expected,diff}}
async function loadPurchases(){let h=$('history');h.innerHTML='<div class="empty">⏳</div>';try{let rows=rowsOf(await api('purchaseList'));if(!rows.length){currentGroups=[];h.innerHTML='<div class="empty">0</div>';return}let groups={};rows.forEach(x=>{let k=purchaseKey(x);(groups[k]??=[]).push(x)});currentGroups=Object.values(groups).sort((a,b)=>String(b[0].createdAt||b[0].Data||'').localeCompare(String(a[0].createdAt||a[0].Data||'')));h.innerHTML=currentGroups.map(g=>{let x=g[0],total=g.reduce((s,z)=>s+num(z.Totali??z.total??0),0),c=groupCheck(g);return `<div class="receipt"><div class="receiptTop"><b>${esc(x.Dyqani||x.store||'Blerje')}</b><span class="price">${total.toFixed(2)} €</span></div><div class="muted">${esc(safeDate(x.Data||x.date||''))} ${esc(safeTime(x.Ora||x.time||''))} ${x.receiptNumber?'• '+esc(x.receiptNumber):''}</div><div class="items">${g.map(z=>`<div class="item"><span>${esc(z.Produkti||z.product||'Produkt')} × ${esc(z.Sasia||z.quantity||1)}</span><span>${num(z.Totali??z.total??0).toFixed(2)} €</span></div>`).join('')}</div>${c.known?checkHtml(c):`<div class="check info">ℹ️ Kontrolli: ${total.toFixed(2)} € · total origjinal i kasenbonit mungon në të dhënat e vjetra</div>`}</div>`}).join('')}catch(e){h.innerHTML=`<div class="empty danger">⚠️ ${esc(e.message)}</div>`}}
$('refreshBtn').onclick=loadPurchases;
$('lang').onchange=e=>{setLang(e.target.value);loadPurchases();if(scanData)renderScan(scanData)};
setLang((localStorage.getItem('mh_language')||localStorage.getItem('lang')||'sq').toLowerCase());
loadPurchases();window.addEventListener('pageshow',loadPurchases);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadPurchases()});
</script></body></html>
